                          val res = if (frame == null || frame.isEmpty()) {
                              false to "Avval nazoratni yoqib, yuzingizni kameraga qarating"
                          } else {
                              FaceProfileManager.enrollFromJpeg(activity, personName, frame)
                          }
                          val escMsg = res.second.replace("\\", "\\\\").replace("'", "\\'")
                          activity.runOnUiThread {
                              webView.evaluateJavascript("window.onFaceEnrolled(${res.first}, '$escMsg');", null)
                          }
                      }.start()
                  }

