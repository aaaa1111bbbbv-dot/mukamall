              private fun imageProxyToJpeg(image: ImageProxy, quality: Int): ByteArray? {
                  return try {
                      val nv21 = yuv420ToNv21(image)
                      val yuvImage = YuvImage(nv21, ImageFormat.NV21, image.width, image.height, null)
                      val out = ByteArrayOutputStream()
                      yuvImage.compressToJpeg(Rect(0, 0, image.width, image.height), quality, out)
                      val raw = out.toByteArray()
                      val rot = image.imageInfo.rotationDegrees
                      if (rot == 0) return raw
                      val bmp = BitmapFactory.decodeByteArray(raw, 0, raw.size) ?: return raw
                      val matrix = Matrix().apply { postRotate(rot.toFloat()) }
                      val rotated = Bitmap.createBitmap(bmp, 0, 0, bmp.width, bmp.height, matrix, true)
                      val out2 = ByteArrayOutputStream()
                      rotated.compress(Bitmap.CompressFormat.JPEG, quality, out2)
                      out2.toByteArray()
                  } catch (_: Exception) {
                      null
                  }
              }

              private fun yuv420ToNv21(image: ImageProxy): ByteArray {
                  val w = image.width
                  val h = image.height
                  val yPlane = image.planes[0]
                  val uPlane = image.planes[1]
                  val vPlane = image.planes[2]
                  val nv21 = ByteArray(w * h * 3 / 2)
                  var pos = 0
                  for (row in 0 until h) {
                      val rowStart = row * yPlane.rowStride
                      for (col in 0 until w) {
                          nv21[pos++] = yPlane.buffer.get(rowStart + col * yPlane.pixelStride)
                      }
                  }
                  val chromaH = h / 2
                  val chromaW = w / 2
                  for (row in 0 until chromaH) {
                      val vRow = row * vPlane.rowStride
                      val uRow = row * uPlane.rowStride
                      for (col in 0 until chromaW) {
                          nv21[pos++] = vPlane.buffer.get(vRow + col * vPlane.pixelStride)
                          nv21[pos++] = uPlane.buffer.get(uRow + col * uPlane.pixelStride)
                      }
                  }
                  return nv21
              }

              private fun bitmapToGray48x36(bmp: Bitmap): ByteArray {
                  val gw = 48
                  val gh = 36
                  val scaled = Bitmap.createScaledBitmap(bmp, gw, gh, false)
                  val out = ByteArray(gw * gh)
                  var idx = 0
                  for (y in 0 until gh) {
                      for (x in 0 until gw) {
                          val p = scaled.getPixel(x, y)
                          val r = (p shr 16) and 0xFF
                          val g = (p shr 8) and 0xFF
                          val b = p and 0xFF
                          out[idx++] = ((r * 30 + g * 59 + b * 11) / 100).toByte()
                      }
                  }
                  return out
              }

