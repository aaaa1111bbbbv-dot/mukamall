              override fun onSensorChanged(event: SensorEvent?) {
                  if (event?.sensor?.type != Sensor.TYPE_ACCELEROMETER || !isRunning) return
                  val x = event.values[0]
                  val y = event.values[1]
                  val z = event.values[2]
                  val g = sqrt(x * x + y * y + z * z)
                  val delta = abs(g - lastAccel)
                  lastAccel = g

                  val cfg = SecureStore.loadConfig(this)
                  if (cfg.optBoolean("tamperAlert", true) && delta > 7.5f && isWithinSchedule(cfg)) {
                      val now = System.currentTimeMillis()
                      if (now - lastTamperMs > 25_000L) {
                          lastTamperMs = now
                          addEvent("📳 Telefon joyidan qimirlatildi yoki silkitildi!")
                          val frame = latestFullJpeg.get()
                          if (frame != null) {
                              sendPhotoWithFallback(cfg, frame, "🚨 BUZG‘UNCHILIK!\nQo‘riqlash telefoni joyidan qo‘zg‘atildi!")
                          } else {
                              sendTelegramText(cfg, "🚨 BUZG‘UNCHILIK!\nQo‘riqlash telefoni joyidan qo‘zg‘atildi!")
                          }
                      }
                  }
                  checkPowerDisconnect(cfg)
              }

              override fun onAccuracyChanged(sensor: Sensor?, accuracy: Int) {}

              private fun checkPowerDisconnect(cfg: JSONObject) {
                  val statusIntent = registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
                  val plugged = statusIntent?.getIntExtra(BatteryManager.EXTRA_PLUGGED, -1) ?: -1
                  val isCharging = plugged == BatteryManager.BATTERY_PLUGGED_AC ||
                      plugged == BatteryManager.BATTERY_PLUGGED_USB ||
                      plugged == BatteryManager.BATTERY_PLUGGED_WIRELESS

                  if (wasCharging && !isCharging && cfg.optBoolean("powerAlert", true)) {
                      val now = System.currentTimeMillis()
                      if (now - lastPowerAlertMs > 60_000L) {
                          lastPowerAlertMs = now
                          addEvent("🔌 220V elektr toki / zaryad uzildi!")
                          sendTelegramText(cfg, "⚡ DIQQAT! Binoda 220V elektr toki uzildi (telefon batareyaga o‘tdi).")
                      }
                  }
                  wasCharging = isCharging
              }

              private fun getBatteryPercent(): Int {
                  val bm = getSystemService(Context.BATTERY_SERVICE) as? BatteryManager
                  return bm?.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY) ?: -1
              }

              private fun isWithinSchedule(cfg: JSONObject): Boolean {
                  if (!cfg.optBoolean("schedEnabled", false)) return true
                  val startStr = cfg.optString("schedStart", "22:00")
                  val endStr = cfg.optString("schedEnd", "07:00")
                  val startMin = parseHhMm(startStr) ?: return true
                  val endMin = parseHhMm(endStr) ?: return true
                  val nowStr = SimpleDateFormat("HH:mm", Locale.US).format(Date())
                  val nowMin = parseHhMm(nowStr) ?: return true
                  return if (startMin <= endMin) {
                      nowMin in startMin..endMin
                  } else {
                      nowMin >= startMin || nowMin <= endMin
                  }
              }

              private fun parseHhMm(s: String): Int? {
                  val parts = s.trim().split(":")
                  if (parts.size != 2) return null
                  val h = parts[0].toIntOrNull() ?: return null
                  val m = parts[1].toIntOrNull() ?: return null
                  return h * 60 + m
              }

