          package uz.qoriqlash.app

          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.media.MediaCodec
          import android.media.MediaCodecInfo
          import android.media.MediaFormat
          import android.media.MediaMuxer
          import java.io.File

          object JpegToMp4Encoder {

              fun encodeFramesToMp4(jpegFrames: List<ByteArray>, outFile: File, fps: Int = 4): Boolean {
                  if (jpegFrames.size < 2) return false
                  val firstBmp = BitmapFactory.decodeByteArray(jpegFrames[0], 0, jpegFrames[0].size) ?: return false

                  val width = ((firstBmp.width.coerceAtMost(640)) / 16) * 16
                  val height = ((firstBmp.height.coerceAtMost(480)) / 16) * 16
                  if (width < 64 || height < 64) return false

                  var encoder: MediaCodec? = null
                  var muxer: MediaMuxer? = null

                  return try {
                      val format = MediaFormat.createVideoFormat(MediaFormat.MIMETYPE_VIDEO_AVC, width, height).apply {
                          setInteger(MediaFormat.KEY_COLOR_FORMAT, MediaCodecInfo.CodecCapabilities.COLOR_FormatYUV420Flexible)
                          setInteger(MediaFormat.KEY_BIT_RATE, 900_000)
                          setInteger(MediaFormat.KEY_FRAME_RATE, fps)
                          setInteger(MediaFormat.KEY_I_FRAME_INTERVAL, 1)
                      }

                      encoder = MediaCodec.createEncoderByType(MediaFormat.MIMETYPE_VIDEO_AVC)
                      encoder.configure(format, null, null, MediaCodec.CONFIGURE_FLAG_ENCODE)
                      encoder.start()

                      muxer = MediaMuxer(outFile.absolutePath, MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4)
                      var trackIndex = -1
                      val muxerState = BooleanArray(1) { false }
                      val bufferInfo = MediaCodec.BufferInfo()
                      val frameDurationUs = 1_000_000L / fps

                      for (i in jpegFrames.indices) {
                          val bmp = BitmapFactory.decodeByteArray(jpegFrames[i], 0, jpegFrames[i].size) ?: continue
                          val scaled = Bitmap.createScaledBitmap(bmp, width, height, true)
                          val yuv = bitmapToNv12(scaled, width, height)

                          val inIdx = encoder.dequeueInputBuffer(10_000)
                          if (inIdx >= 0) {
                              val inBuf = encoder.getInputBuffer(inIdx)
                              inBuf?.clear()
                              inBuf?.put(yuv)
                              encoder.queueInputBuffer(inIdx, 0, yuv.size, i * frameDurationUs, 0)
                          }
                          drainEncoder(encoder, muxer, bufferInfo, false, muxerState) { newTrack ->
                              trackIndex = newTrack
                          }
                      }

                      val eosIdx = encoder.dequeueInputBuffer(10_000)
                      if (eosIdx >= 0) {
                          encoder.queueInputBuffer(
                              eosIdx, 0, 0,
                              jpegFrames.size * frameDurationUs,
                              MediaCodec.BUFFER_FLAG_END_OF_STREAM
                          )
                      }
                      drainEncoder(encoder, muxer, bufferInfo, true, muxerState) { newTrack ->
                          trackIndex = newTrack
                      }

                      if (muxerState[0] && trackIndex >= 0) {
                          muxer.stop()
                      }
                      outFile.exists() && outFile.length() > 1024
                  } catch (_: Exception) {
                      false
                  } finally {
                      try { encoder?.stop() } catch (_: Exception) {}
                      try { encoder?.release() } catch (_: Exception) {}
                      try { muxer?.release() } catch (_: Exception) {}
                  }
              }

              private fun drainEncoder(
                  encoder: MediaCodec,
                  muxer: MediaMuxer,
                  info: MediaCodec.BufferInfo,
                  endOfStream: Boolean,
                  muxerState: BooleanArray,
                  onTrackAdded: (Int) -> Unit
              ) {
                  while (true) {
                      val outIdx = encoder.dequeueOutputBuffer(info, 10_000)
                      if (outIdx == MediaCodec.INFO_TRY_AGAIN_LATER) {
                          if (!endOfStream) break
                      } else if (outIdx == MediaCodec.INFO_OUTPUT_FORMAT_CHANGED) {
                          val track = muxer.addTrack(encoder.outputFormat)
                          muxer.start()
                          muxerState[0] = true
                          onTrackAdded(track)
                      } else if (outIdx >= 0) {
                          val encoded = encoder.getOutputBuffer(outIdx) ?: continue
                          if ((info.flags and MediaCodec.BUFFER_FLAG_CODEC_CONFIG) != 0) {
                              info.size = 0
                          }
                          if (info.size > 0 && muxerState[0]) {
                              encoded.position(info.offset)
                              encoded.limit(info.offset + info.size)
                              muxer.writeSampleData(0, encoded, info)
                          }
                          encoder.releaseOutputBuffer(outIdx, false)
                          if ((info.flags and MediaCodec.BUFFER_FLAG_END_OF_STREAM) != 0) break
                      }
                  }
              }

              private fun bitmapToNv12(bmp: Bitmap, width: Int, height: Int): ByteArray {
                  val argb = IntArray(width * height)
                  bmp.getPixels(argb, 0, width, 0, 0, width, height)
                  val yuv = ByteArray(width * height * 3 / 2)
                  var yIndex = 0
                  var uvIndex = width * height
                  for (j in 0 until height) {
                      for (i in 0 until width) {
                          val c = argb[j * width + i]
                          val r = (c shr 16) and 0xFF
                          val g = (c shr 8) and 0xFF
                          val b = c and 0xFF
                          val y = ((66 * r + 129 * g + 25 * b + 128) shr 8) + 16
                          yuv[yIndex++] = y.coerceIn(0, 255).toByte()
                          if (j % 2 == 0 && i % 2 == 0 && uvIndex + 1 < yuv.size) {
                              val u = ((-38 * r - 74 * g + 112 * b + 128) shr 8) + 128
                              val v = ((112 * r - 94 * g - 18 * b + 128) shr 8) + 128
                              yuv[uvIndex++] = u.coerceIn(0, 255).toByte()
                              yuv[uvIndex++] = v.coerceIn(0, 255).toByte()
                          }
                      }
                  }
                  return yuv
              }
          }
