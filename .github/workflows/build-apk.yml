              private fun sendPhotoWithFallback(cfg: JSONObject, jpegBytes: ByteArray, caption: String) {
                  val token = cfg.optString("token", "").trim()
                  val chatId = cfg.optString("chatId", "").trim()
                  if (token.isEmpty() || chatId.isEmpty()) return

                  networkExecutor.execute {
                      val sent = uploadPhotoDirect(token, chatId, jpegBytes, caption)
                      if (!sent) {
                          OfflineQueue.enqueuePhoto(this, caption, jpegBytes)
                      }
                  }
              }

              private fun flushOfflineQueue(cfg: JSONObject) {
                  val token = cfg.optString("token", "").trim()
                  val chatId = cfg.optString("chatId", "").trim()
                  if (token.isEmpty() || chatId.isEmpty()) return
                  if (OfflineQueue.size(this) == 0) return

                  networkExecutor.execute {
                      val item = OfflineQueue.peekOldest(this) ?: return@execute
                      val bytes = try { item.first.readBytes() } catch (_: Exception) { return@execute }
                      val ok = uploadPhotoDirect(token, chatId, bytes, "📦 [OFLAYN ARXIV]\n${item.third}")
                      if (ok) {
                          item.first.delete()
                          item.second.delete()
                      }
                  }
              }

              private fun uploadPhotoDirect(token: String, chatId: String, jpegBytes: ByteArray, caption: String): Boolean {
                  return try {
                      val body = MultipartBody.Builder()
                          .setType(MultipartBody.FORM)
                          .addFormDataPart("chat_id", chatId)
                          .addFormDataPart("caption", caption)
                          .addFormDataPart(
                              "photo",
                              "guard_${System.currentTimeMillis()}.jpg",
                              jpegBytes.toRequestBody("image/jpeg".toMediaType())
                          )
                          .build()
                      val req = Request.Builder()
                          .url("https://api.telegram.org/bot$token/sendPhoto")
                          .post(body)
                          .build()
                      httpClient.newCall(req).execute().use { it.isSuccessful }
                  } catch (_: Exception) {
                      false
                  }
              }

