              private fun pollTelegramCommands(cfg: JSONObject) {
                  val token = cfg.optString("token", "").trim()
                  val allowedChatId = cfg.optString("chatId", "").trim()
                  if (token.isEmpty() || allowedChatId.isEmpty()) return

                  networkExecutor.execute {
                      try {
                          val offset = SecureStore.getLastUpdateId(this) + 1
                          val req = Request.Builder()
                              .url("https://api.telegram.org/bot$token/getUpdates?offset=$offset&timeout=1")
                              .build()
                          httpClient.newCall(req).execute().use { resp ->
                              if (!resp.isSuccessful) return@use
                              val root = JSONObject(resp.body?.string() ?: "")
                              if (!root.optBoolean("ok", false)) return@use
                              val arr = root.optJSONArray("result") ?: return@use
                              var maxId = offset - 1
                              for (i in 0 until arr.length()) {
                                  val upd = arr.optJSONObject(i) ?: continue
                                  val uid = upd.optLong("update_id", 0L)
                                  if (uid > maxId) maxId = uid
                                  val msg = upd.optJSONObject("message") ?: continue
                                  val chatId = msg.optJSONObject("chat")?.optLong("id", 0L)?.toString() ?: ""
                                  if (chatId != allowedChatId) continue
                                  val text = msg.optString("text", "").trim().lowercase()
                                  handleTelegramBotCommand(cfg, text)
                              }
                              if (maxId >= offset) {
                                  SecureStore.setLastUpdateId(this, maxId)
                              }
                          }
                      } catch (_: Exception) {
                      }
                  }
              }

