          package uz.qoriqlash.app

          import android.annotation.SuppressLint
          import android.media.AudioFormat
          import android.media.AudioRecord
          import android.media.MediaRecorder
          import kotlin.math.abs
          import kotlin.math.sqrt

          class DangerAudioDetector(
              private val onAcousticAlert: (reason: String, levelDb: Int) -> Unit
          ) {
              @Volatile
              private var running = false
              private var worker: Thread? = null
              private var lastTriggerMs = 0L

              @SuppressLint("MissingPermission")
              fun start() {
                  if (running) return
                  running = true
                  worker = Thread {
                      val sampleRate = 16000
                      val minBuf = AudioRecord.getMinBufferSize(
                          sampleRate,
                          AudioFormat.CHANNEL_IN_MONO,
                          AudioFormat.ENCODING_PCM_16BIT
                      )
                      if (minBuf <= 0) return@Thread

                      var recorder: AudioRecord? = null
                      try {
                          recorder = AudioRecord(
                              MediaRecorder.AudioSource.MIC,
                              sampleRate,
                              AudioFormat.CHANNEL_IN_MONO,
                              AudioFormat.ENCODING_PCM_16BIT,
                              minBuf * 2
                          )
                          if (recorder.state != AudioRecord.STATE_INITIALIZED) return@Thread
                          recorder.startRecording()

                          val buf = ShortArray(minBuf)
                          while (running) {
                              val read = recorder.read(buf, 0, buf.size)
                              if (read <= 0) continue

                              var sumSq = 0.0
                              var zeroCrossings = 0
                              var prev = buf[0].toInt()
                              var peak = 0

                              for (i in 0 until read) {
                                  val v = buf[i].toInt()
                                  val av = abs(v)
                                  if (av > peak) peak = av
                                  sumSq += v.toDouble() * v.toDouble()
                                  if ((v >= 0 && prev < 0) || (v < 0 && prev >= 0)) {
                                      zeroCrossings++
                                  }
                                  prev = v
                              }

                              val rms = sqrt(sumSq / read)
                              val zcrRatio = zeroCrossings.toDouble() / read.toDouble()
                              val now = System.currentTimeMillis()

                              if (rms > 6800 && now - lastTriggerMs > 18_000L) {
                                  lastTriggerMs = now
                                  val reason = when {
                                      zcrRatio > 0.28 && peak > 24000 -> "💥 Shisha sinishi yoki keskin zarba tovushi!"
                                      zcrRatio > 0.14 && rms > 8500 -> "😱 Baland qichqiriq yoki sirenaga o‘xshash tovush!"
                                      else -> "🔊 Xonada juda baland shovqin aniqlandi!"
                                  }
                                  onAcousticAlert(reason, (rms / 320).toInt())
                              }
                          }
                      } catch (_: Exception) {
                      } finally {
                          try {
                              recorder?.stop()
                              recorder?.release()
                          } catch (_: Exception) {
                          }
                      }
                  }.apply { isDaemon = true; start() }
              }

              fun stop() {
                  running = false
                  worker?.interrupt()
                  worker = null
              }
          }
