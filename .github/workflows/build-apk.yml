          package uz.qoriqlash.app

          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Rect
          import com.google.android.gms.tasks.Tasks
          import com.google.mlkit.vision.common.InputImage
          import com.google.mlkit.vision.face.Face
          import com.google.mlkit.vision.face.FaceDetection
          import com.google.mlkit.vision.face.FaceDetectorOptions
          import org.json.JSONArray
          import org.json.JSONObject
          import kotlin.math.sqrt

          object FaceProfileManager {

              private val detector by lazy {
                  val opts = FaceDetectorOptions.Builder()
                      .setPerformanceMode(FaceDetectorOptions.PERFORMANCE_MODE_FAST)
                      .setLandmarkMode(FaceDetectorOptions.LANDMARK_MODE_NONE)
                      .setClassificationMode(FaceDetectorOptions.CLASSIFICATION_MODE_NONE)
                      .setMinFaceSize(0.12f)
                      .build()
                  FaceDetection.getClient(opts)
              }

              data class FaceScanOutcome(
                  val totalFaces: Int,
                  val knownNames: List<String>,
                  val unknownCount: Int,
                  val primaryBox: Rect?
              )

              fun analyzeBitmap(ctx: Context, bmp: Bitmap): FaceScanOutcome {
                  return try {
                      val image = InputImage.fromBitmap(bmp, 0)
                      val faces = Tasks.await(detector.process(image))
                      if (faces.isEmpty()) {
                          return FaceScanOutcome(0, emptyList(), 0, null)
                      }
                      val savedProfiles = SecureStore.getKnownFacesArray(ctx)
                      val matchedNames = mutableListOf<String>()
                      var unknowns = 0

                      for (face in faces) {
                          val vec = extractFaceSignature(bmp, face.boundingBox)
                          if (vec == null) {
                              unknowns++
                              continue
                          }
                          val bestMatch = findBestMatch(vec, savedProfiles)
                          if (bestMatch != null) {
                              matchedNames.add(bestMatch)
                          } else {
                              unknowns++
                          }
                      }
                      val largest = faces.maxByOrNull { it.boundingBox.width() * it.boundingBox.height() }?.boundingBox
                      FaceScanOutcome(faces.size, matchedNames, unknowns, largest)
                  } catch (_: Exception) {
                      FaceScanOutcome(0, emptyList(), 0, null)
                  }
              }

              fun enrollFromJpeg(ctx: Context, personName: String, jpegBytes: ByteArray): Pair<Boolean, String> {
                  val cleanName = personName.trim()
                  if (cleanName.isEmpty()) return false to "Ism kiritilmadi"
                  val bmp = BitmapFactory.decodeByteArray(jpegBytes, 0, jpegBytes.size)
                      ?: return false to "Rasm o‘qilmadi"

                  return try {
                      val image = InputImage.fromBitmap(bmp, 0)
                      val faces = Tasks.await(detector.process(image))
                      if (faces.isEmpty()) {
                          return false to "Rasmda yuz topilmadi. Yuzingizni kameraga yaqinroq va yorug‘roq tuting."
                      }
                      val mainFace: Face = faces.maxByOrNull { it.boundingBox.width() * it.boundingBox.height() }!!
                      val sig = extractFaceSignature(bmp, mainFace.boundingBox)
                          ?: return false to "Yuz konturi aniq emas"

                      val arr = SecureStore.getKnownFacesArray(ctx)
                      val vecJson = JSONArray()
                      for (v in sig) vecJson.put(v.toDouble())

                      val entry = JSONObject().apply {
                          put("id", System.currentTimeMillis().toString())
                          put("name", cleanName)
                          put("vec", vecJson)
                      }
                      arr.put(entry)
                      SecureStore.saveKnownFacesJson(ctx, arr.toString())
                      true to "✅ '$cleanName' tanishlar ro‘yxatiga qo‘shildi!"
                  } catch (e: Exception) {
                      false to "Xatolik: ${e.message}"
                  }
              }

              fun listProfilesSummary(ctx: Context): String {
                  val arr = SecureStore.getKnownFacesArray(ctx)
                  val out = JSONArray()
                  for (i in 0 until arr.length()) {
                      val item = arr.optJSONObject(i) ?: continue
                      out.put(JSONObject().apply {
                          put("id", item.optString("id"))
                          put("name", item.optString("name"))
                      })
                  }
                  return out.toString()
              }

              fun removeProfile(ctx: Context, id: String) {
                  val arr = SecureStore.getKnownFacesArray(ctx)
                  val next = JSONArray()
                  for (i in 0 until arr.length()) {
                      val item = arr.optJSONObject(i) ?: continue
                      if (item.optString("id") != id) next.put(item)
                  }
                  SecureStore.saveKnownFacesJson(ctx, next.toString())
              }

              private fun extractFaceSignature(src: Bitmap, box: Rect): FloatArray? {
                  val left = box.left.coerceIn(0, src.width - 1)
                  val top = box.top.coerceIn(0, src.height - 1)
                  val right = box.right.coerceIn(left + 1, src.width)
                  val bottom = box.bottom.coerceIn(top + 1, src.height)
                  val w = right - left
                  val h = bottom - top
                  if (w < 20 || h < 20) return null

                  val cropped = Bitmap.createBitmap(src, left, top, w, h)
                  val grid = 12
                  val scaled = Bitmap.createScaledBitmap(cropped, grid, grid, true)

                  val raw = FloatArray(grid * grid)
                  var sum = 0f
                  var idx = 0
                  for (y in 0 until grid) {
                      for (x in 0 until grid) {
                          val p = scaled.getPixel(x, y)
                          val r = (p shr 16) and 0xFF
                          val g = (p shr 8) and 0xFF
                          val b = p and 0xFF
                          val luma = 0.299f * r + 0.587f * g + 0.114f * b
                          raw[idx++] = luma
                          sum += luma
                      }
                  }
                  val mean = sum / raw.size
                  var normSq = 0f
                  for (i in raw.indices) {
                      raw[i] -= mean
                      normSq += raw[i] * raw[i]
                  }
                  val norm = sqrt(normSq)
                  if (norm < 1e-4f) return null
                  for (i in raw.indices) raw[i] /= norm
                  return raw
              }

              private fun findBestMatch(query: FloatArray, saved: JSONArray): String? {
                  var bestScore = -1f
                  var bestName: String? = null

                  for (i in 0 until saved.length()) {
                      val item = saved.optJSONObject(i) ?: continue
                      val vecArr = item.optJSONArray("vec") ?: continue
                      if (vecArr.length() != query.size) continue
                      var dot = 0f
                      for (k in query.indices) {
                          dot += query[k] * vecArr.optDouble(k, 0.0).toFloat()
                      }
                      if (dot > bestScore) {
                          bestScore = dot
                          bestName = item.optString("name")
                      }
                  }
                  return if (bestScore >= 0.78f) bestName else null
              }
          }
