              private val eventsList = mutableListOf<JSONObject>()

              private val burstRunnable = object : Runnable {
                  override fun run() {
                      if (!isRunning || !isBurstRunning) return
                      val cfg = SecureStore.loadConfig(this@MonitorForegroundService)
                      val sec = cfg.optInt("burstSec", 10).coerceIn(3, 3600)
                      captureAndSendBurst(cfg)
                      mainHandler.postDelayed(this, sec * 1000L)
                  }
              }

              private val ipPollRunnable = object : Runnable {
                  override fun run() {
                      if (!isRunning) return
                      val cfg = SecureStore.loadConfig(this@MonitorForegroundService)
                      val sec = cfg.optInt("ipSec", 3).coerceIn(1, 300)
                      pollAllIpCameras(cfg)
                      mainHandler.postDelayed(this, sec * 1000L)
                  }
              }

              private val botPollRunnable = object : Runnable {
                  override fun run() {
                      if (!isRunning) return
                      val cfg = SecureStore.loadConfig(this@MonitorForegroundService)
                      pollTelegramCommands(cfg)
                      flushOfflineQueue(cfg)
                      mainHandler.postDelayed(this, 4000L)
                  }
              }

              private val remoteSyncRunnable = object : Runnable {
                  override fun run() {
                      networkExecutor.execute {
                          val active = SecureStore.isRemoteActive(this@MonitorForegroundService)
                          val state = RemoteControlClient.syncNow(
                              this@MonitorForegroundService,
                              active && !manualStopped
                          )
                          if (!state.active && isRunning) {
                              mainHandler.post {
                                  addEvent("⛔ Admin tomonidan obuna to‘xtatildi: ${state.message}")
                                  stopSelf()
                              }
                          }
                      }
                      mainHandler.postDelayed(this, 60_000L)
                  }
              }

              override fun onCreate() {
                  super.onCreate()
                  activeInstance = this
                  lifecycleRegistry = LifecycleRegistry(this)
                  lifecycleRegistry.handleLifecycleEvent(Lifecycle.Event.ON_CREATE)
                  lifecycleRegistry.handleLifecycleEvent(Lifecycle.Event.ON_START)
                  lifecycleRegistry.handleLifecycleEvent(Lifecycle.Event.ON_RESUME)
                  createNotificationChannel()
                  acquireWakeLock()

                  val today = SimpleDateFormat("yyyy-MM-dd", Locale.US).format(Date())
                  val saved = SecureStore.loadCounts(this, today)
                  countEnterToday = saved.first
                  countExitToday = saved.second

                  sensorManager = getSystemService(Context.SENSOR_SERVICE) as? SensorManager
                  sensorManager?.getDefaultSensor(Sensor.TYPE_ACCELEROMETER)?.let { acc ->
                      sensorManager?.registerListener(this, acc, SensorManager.SENSOR_DELAY_NORMAL)
                  }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val action = intent?.action ?: ACTION_START
                  when (action) {
                      ACTION_START -> {
                          if (!SecureStore.isRemoteActive(this)) {
                              stopSelf()
                              return START_NOT_STICKY
                          }
                          manualStopped = false
                          startForeground(NOTIF_ID, buildNotification("Qo‘riqlash tizimi faol"))
                          isRunning = true
                          SecureStore.setWasRunning(this, true)
                          val cfg = SecureStore.loadConfig(this)
                          applyConfiguration(cfg)
                          addEvent("🛡 Qo‘riqlash Cyber-Pro tizimi ishga tushdi")
                      }
                      ACTION_STOP -> {
                          manualStopped = true
                          isRunning = false
                          isBurstRunning = false
                          SecureStore.setWasRunning(this, false)
                          stopAllLoops()
                          addEvent("⏹ Qo‘riqlash to‘xtatildi")
                          stopForeground(STOP_FOREGROUND_REMOVE)
                          stopSelf()
                      }
                      ACTION_BURST -> {
                          val enable = intent?.getBooleanExtra("enable", false) ?: false
                          isBurstRunning = enable
                          mainHandler.removeCallbacks(burstRunnable)
                          if (enable && isRunning) {
                              burstSentCount = 0
                              mainHandler.post(burstRunnable)
                              addEvent("⏱ Oraliq rasm yuborish yoqildi")
                          } else {
                              addEvent("⏹ Oraliq rasm yuborish to‘xtatildi")
                          }
                      }
                      ACTION_SHOT -> {
                          val cfg = SecureStore.loadConfig(this)
                          sendInstantSnapshot(cfg, "📸 Qo‘lda so‘ralgan oniy rasm")
                      }
                      ACTION_VIDEO_NOW -> {
                          val cfg = SecureStore.loadConfig(this)
                          triggerVideoClip(cfg, "🎥 Qo‘lda yozilgan 10 soniyali video")
                      }
                      ACTION_CLEAR_LOG -> {
                          synchronized(eventsList) {
                              eventsList.clear()
                              eventsJson = "[]"
                          }
                      }
                  }
                  return START_STICKY
              }

              private fun applyConfiguration(cfg: JSONObject) {
                  val mode = cfg.optString("mode", "phone")
                  val lens = cfg.optString("lens", "back")
                  val burstOn = cfg.optBoolean("burst", false)
                  val audioOn = cfg.optBoolean("audioAlert", true)

                  lastStatusText = "Faol ($mode)"
                  updateNotification("Qo‘riqlash faol · Kirish:$countEnterToday Chiqish:$countExitToday")

                  if (mode == "phone" || mode == "both") {
                      activeCameraLens = lens
                      bindPhoneCamera()
                  } else {
                      unbindPhoneCamera()
                  }

                  mainHandler.removeCallbacks(ipPollRunnable)
                  if (mode == "ip" || mode == "both") {
                      mainHandler.post(ipPollRunnable)
                  }

                  mainHandler.removeCallbacks(burstRunnable)
                  isBurstRunning = burstOn
                  if (burstOn) {
                      mainHandler.postDelayed(burstRunnable, 1500L)
                  }

                  audioDetector?.stop()
                  if (audioOn) {
                      audioDetector = DangerAudioDetector { reason, _ ->
                          if (!isRunning) return@DangerAudioDetector
                          val c = SecureStore.loadConfig(this)
                          if (!isWithinSchedule(c)) return@DangerAudioDetector
                          addEvent(reason)
                          val frame = latestFullJpeg.get()
                          if (frame != null) {
                              sendPhotoWithFallback(c, frame, "🚨 TOVUSH TREVOGASI!\n$reason")
                          } else {
                              sendTelegramText(c, "🚨 TOVUSH TREVOGASI!\n$reason")
                          }
                          triggerVideoClip(c, reason)
                      }.also { it.start() }
                  }

                  mainHandler.removeCallbacks(botPollRunnable)
                  mainHandler.postDelayed(botPollRunnable, 2500L)

                  mainHandler.removeCallbacks(remoteSyncRunnable)
                  mainHandler.postDelayed(remoteSyncRunnable, 6000L)
              }

              private fun stopAllLoops() {
                  mainHandler.removeCallbacks(burstRunnable)
                  mainHandler.removeCallbacks(ipPollRunnable)
                  mainHandler.removeCallbacks(botPollRunnable)
                  mainHandler.removeCallbacks(remoteSyncRunnable)
                  audioDetector?.stop()
                  unbindPhoneCamera()
              }

              @Suppress("DEPRECATION")
              private fun bindPhoneCamera() {
                  val future = ProcessCameraProvider.getInstance(this)
                  future.addListener({
                      try {
                          val provider = future.get()
                          cameraProvider = provider
                          provider.unbindAll()
                          if (!isRunning) return@addListener

                          val selector = if (activeCameraLens == "front") {
                              CameraSelector.DEFAULT_FRONT_CAMERA
                          } else {
                              CameraSelector.DEFAULT_BACK_CAMERA
                          }

                          val analysis = ImageAnalysis.Builder()
                              .setTargetResolution(Size(640, 480))
                              .setBackpressureStrategy(ImageAnalysis.STRATEGY_KEEP_ONLY_LATEST)
                              .build()

                          analysis.setAnalyzer(cameraExecutor) { image ->
                              processPhoneFrame(image)
                          }

                          val sp = previewSurfaceProvider.get()
                          if (uiVisible.get() && sp != null) {
                              val preview = Preview.Builder()
                                  .setTargetResolution(Size(640, 480))
                                  .build()
                                  .also { it.setSurfaceProvider(sp) }
                              provider.bindToLifecycle(this, selector, preview, analysis)
                          } else {
                              provider.bindToLifecycle(this, selector, analysis)
                          }
                      } catch (e: Exception) {
                          addEvent("⚠️ Telefon kamerasi xatosi: ${e.message}")
                      }
                  }, ContextCompat.getMainExecutor(this))
              }

              private fun unbindPhoneCamera() {
                  try {
                      cameraProvider?.unbindAll()
                  } catch (_: Exception) {
                  }
              }

              private fun processPhoneFrame(image: ImageProxy) {
                  try {
                      if (!isRunning) return
                      val nowMs = System.currentTimeMillis()
                      // Soniyasiga max 5 kadr tahlil qilinadi -> CPU hech qachon qotmaydi
                      if (nowMs - lastFrameAnalyzeMs < 200L) return
                      lastFrameAnalyzeMs = nowMs

                      val cfg = SecureStore.loadConfig(this)
                      val mode = cfg.optString("mode", "phone")
                      if (mode != "phone" && mode != "both") return

                      val yPlane = image.planes[0]
                      val yBuf = yPlane.buffer
                      val rowStride = yPlane.rowStride
                      val pixelStride = yPlane.pixelStride
                      val w = image.width
                      val h = image.height

                      val gridW = 48
                      val gridH = 36
                      val currGray = ByteArray(gridW * gridH)
                      var brightnessSum = 0L
                      var idx = 0
                      for (gy in 0 until gridH) {
                          val sy = (gy * h) / gridH
                          val rowOffset = sy * rowStride
                          for (gx in 0 until gridW) {
                              val sx = (gx * w) / gridW
                              val pos = rowOffset + sx * pixelStride
                              val v = if (pos < yBuf.limit()) (yBuf.get(pos).toInt() and 0xFF) else 0
                              currGray[idx++] = v.toByte()
                              brightnessSum += v
                          }
                      }

                      val needJpegNow = (nowMs - lastFrameConvertMs >= 450L) || recordingClip.get()
                      var jpegBytes: ByteArray? = latestFullJpeg.get()
                      if (needJpegNow) {
                          val fresh = imageProxyToJpeg(image, 72)
                          if (fresh != null) {
                              lastFrameConvertMs = nowMs
                              jpegBytes = fresh
                              latestFullJpeg.set(fresh)
                              synchronized(ringBufferLock) {
                                  if (rollingFrames.size >= 36) rollingFrames.removeFirst()
                                  rollingFrames.addLast(fresh)
                              }
                          }
                      }

                      val avgBrightness = brightnessSum / (gridW * gridH)
                      if (cfg.optBoolean("tamperAlert", true) && avgBrightness < 10) {
                          if (nowMs - lastTamperMs > 30_000L && isWithinSchedule(cfg)) {
                              lastTamperMs = nowMs
                              addEvent("🕶 Kamera obyektivi yopildi yoki qorong‘ilashdi!")
                              val snap = imageProxyToJpeg(image, 75) ?: jpegBytes
                              if (snap != null) {
                                  sendPhotoWithFallback(cfg, snap, "🚨 BUZG‘UNCHILIK!\nKamera obyektivi to‘sib qo‘yildi!")
                              }
                          }
                      }

                      if (!isWithinSchedule(cfg)) {
                          prevPhoneGray = currGray
                          return
                      }

                      val prev = prevPhoneGray
                      prevPhoneGray = currGray
                      if (prev == null) return

                      val sens = cfg.optInt("sens", 28).coerceIn(5, 95)
                      val pixelThresh = (110 - sens).coerceIn(12, 85)
                      val ratioThresh = ((105 - sens) * 0.0018).coerceIn(0.015, 0.25)

                      var changed = 0
                      for (i in currGray.indices) {
                          val d = abs((currGray[i].toInt() and 0xFF) - (prev[i].toInt() and 0xFF))
                          if (d > pixelThresh) changed++
                      }
                      val ratio = changed.toDouble() / currGray.size.toDouble()
                      if (ratio >= ratioThresh) {
                          val cool = cfg.optInt("cool", 10).coerceIn(3, 600)
                          val last = lastAlertMsMap["phone"] ?: 0L
                          if (nowMs - last >= cool * 1000L) {
                              lastAlertMsMap["phone"] = nowMs
                              val alertJpeg = imageProxyToJpeg(image, 78) ?: jpegBytes
                              if (alertJpeg != null) {
                                  latestFullJpeg.set(alertJpeg)
                                  networkExecutor.execute {
                                      handleMotionWithAiAndZoom(cfg, "Telefon kamerasi", alertJpeg, ratio, isPhone = true)
                                  }
                              }
                          }
                      }
                  } catch (_: Exception) {
                  } finally {
                      image.close()
                  }
              }

              private fun handleMotionWithAiAndZoom(
                  cfg: JSONObject,
                  sourceName: String,
                  rawJpeg: ByteArray,
                  motionRatio: Double,
                  isPhone: Boolean
              ) {
                  val bmp = BitmapFactory.decodeByteArray(rawJpeg, 0, rawJpeg.size) ?: return
                  val pct = (motionRatio * 100).toInt().coerceIn(1, 100)

                  val faceScan = FaceProfileManager.analyzeBitmap(this, bmp)
                  if (faceScan.totalFaces > 0 && faceScan.unknownCount == 0 && faceScan.knownNames.isNotEmpty()) {
                      val names = faceScan.knownNames.distinct().joinToString(", ")
                      lastRecognizedPerson = names
                      addEvent("😊 Tanish odam aniqlandi: $names (Signal yuborilmadi)")
                      return
                  }

                  val objRes = detectObjectBox(bmp)
                  val label = when {
                      faceScan.unknownCount > 0 -> "🚨 NOTANISH SHAXS (${faceScan.unknownCount} kishi)"
                      objRes.first.isNotEmpty() -> objRes.first
                      else -> "Harakat aniqlandi"
                  }

                  val targetBox = faceScan.primaryBox ?: objRes.second
                  if (isPhone && targetBox != null && cfg.optBoolean("doorCounter", true)) {
                      val cx = targetBox.centerX().toFloat() / bmp.width.toFloat()
                      if (lastTrackedCenterX >= 0f) {
                          if (lastTrackedCenterX < 0.45f && cx > 0.55f) {
                              countEnterToday++
                              saveTodayCounts()
                          } else if (lastTrackedCenterX > 0.55f && cx < 0.45f) {
                              countExitToday++
                              saveTodayCounts()
                          }
                      }
                      lastTrackedCenterX = cx
                      updateNotification("Faol · Kirish:$countEnterToday Chiqish:$countExitToday")
                  }

                  val annotatedJpeg = if (cfg.optBoolean("autoZoom", true) && targetBox != null) {
                      createZoomedAnnotatedJpeg(bmp, targetBox, label) ?: rawJpeg
                  } else {
                      rawJpeg
                  }

                  if (cfg.optBoolean("siren", false)) {
                      playLocalAlarmBeep()
                  }

                  val timeStr = SimpleDateFormat("HH:mm:ss", Locale.getDefault()).format(Date())
                  val caption = buildString {
                      appendLine("🚨 XAVF SIGNALI · $sourceName")
                      appendLine("🔍 Tahlil: $label ($pct%)")
                      if (faceScan.knownNames.isNotEmpty()) {
                          appendLine("👤 Yonida tanish: ${faceScan.knownNames.joinToString(", ")}")
                      }
                      appendLine("📊 Bugun: Kirish $countEnterToday | Chiqish $countExitToday")
                      append("🕒 Vaqt: $timeStr")
                  }

                  addEvent("$sourceName: $label ($pct%)")
                  sendPhotoWithFallback(cfg, annotatedJpeg, caption)

                  if (isPhone && cfg.optBoolean("autoVideo", true)) {
                      triggerVideoClip(cfg, "$sourceName: $label")
                  }
              }

              private fun detectObjectBox(bmp: Bitmap): Pair<String, Rect?> {
                  return try {
                      val img = InputImage.fromBitmap(bmp, 0)
                      val objects = Tasks.await(objectDetector.process(img))
                      if (objects.isEmpty()) return "" to null
                      val best = objects.maxByOrNull { it.boundingBox.width() * it.boundingBox.height() }!!
                      val cat = best.labels.maxByOrNull { it.confidence }?.text ?: ""
                      val uzLabel = when {
                          cat.contains("Fashion", true) -> "Odam / Kiyim"
                          cat.contains("Home", true) -> "Buyum harakati"
                          cat.contains("Food", true) -> "Obyekt"
                          else -> "Harakatdagi obyekt"
                      }
                      uzLabel to best.boundingBox
                  } catch (_: Exception) {
                      "" to null
                  }
              }

              private fun createZoomedAnnotatedJpeg(src: Bitmap, box: Rect, label: String): ByteArray? {
                  return try {
                      val padX = (box.width() * 0.45f).toInt()
                      val padY = (box.height() * 0.45f).toInt()
                      val left = (box.left - padX).coerceIn(0, src.width - 1)
                      val top = (box.top - padY).coerceIn(0, src.height - 1)
                      val right = (box.right + padX).coerceIn(left + 1, src.width)
                      val bottom = (box.bottom + padY).coerceIn(top + 1, src.height)

                      val cropped = Bitmap.createBitmap(src, left, top, right - left, bottom - top)
                          .copy(Bitmap.Config.ARGB_8888, true)

                      val canvas = Canvas(cropped)
                      val paint = Paint().apply {
                          color = Color.RED
                          style = Paint.Style.STROKE
                          strokeWidth = (cropped.width * 0.012f).coerceAtLeast(4f)
                      }
                      val relBox = Rect(
                          (box.left - left).coerceAtLeast(2),
                          (box.top - top).coerceAtLeast(2),
                          (box.right - left).coerceAtMost(cropped.width - 2),
                          (box.bottom - top).coerceAtMost(cropped.height - 2)
                      )
                      canvas.drawRect(relBox, paint)

                      val textPaint = Paint().apply {
                          color = Color.YELLOW
                          textSize = (cropped.width * 0.045f).coerceIn(18f, 42f)
                          isFakeBoldText = true
                      }
                      canvas.drawText("ZOOM: $label", 14f, textPaint.textSize + 10f, textPaint)

                      val out = ByteArrayOutputStream()
                      cropped.compress(Bitmap.CompressFormat.JPEG, 82, out)
                      out.toByteArray()
                  } catch (_: Exception) {
                      null
                  }
              }

              private fun triggerVideoClip(cfg: JSONObject, reason: String) {
                  if (recordingClip.getAndSet(true)) return
                  networkExecutor.execute {
                      try {
                          val collected = mutableListOf<ByteArray>()
                          synchronized(ringBufferLock) {
                              collected.addAll(rollingFrames.toList().takeLast(14))
                          }
                          val startMs = System.currentTimeMillis()
                          while (System.currentTimeMillis() - startMs < 6000L && collected.size < 36 && isRunning) {
                              Thread.sleep(300L)
                              latestFullJpeg.get()?.let { f ->
                                  if (collected.isEmpty() || collected.last() !== f) {
                                      collected.add(f)
                                  }
                              }
                          }
                          if (collected.size >= 4) {
                              val tmpMp4 = File(cacheDir, "alert_${System.currentTimeMillis()}.mp4")
                              val ok = JpegToMp4Encoder.encodeFramesToMp4(collected, tmpMp4, fps = 4)
                              if (ok) {
                                  sendTelegramVideo(cfg, tmpMp4, "🎥 10 SONIYALI VIDEO DALIL\n$reason")
                              }
                              tmpMp4.delete()
                          }
                      } catch (_: Exception) {
                      } finally {
                          recordingClip.set(false)
                      }
                  }
              }

              private fun collectAllIpChannels(cfg: JSONObject): List<JSONObject> {
                  val channels = mutableListOf<JSONObject>()
                  val devices = cfg.optJSONArray("devices") ?: JSONArray()
                  for (d in 0 until devices.length()) {
                      val dev = devices.optJSONObject(d) ?: continue
                      val devName = dev.optString("name", "Kamera #${d + 1}")
                      val type = dev.optString("type", "hikvision")
                      val ip = dev.optString("ip", "").trim()
                      val port = dev.optString("port", "80").trim().ifEmpty { "80" }
                      val user = dev.optString("user", "")
                      val pass = dev.optString("pass", "")
                      val customUrl = dev.optString("customUrl", "").trim()
                      val chList = dev.optString("channels", "1").split(",")

                      if (type == "url" && customUrl.isNotEmpty()) {
                          channels.add(JSONObject().apply {
                              put("key", "dev_${d}_url")
                              put("title", devName)
                              put("url", customUrl)
                              put("user", user)
                              put("pass", pass)
                          })
                          continue
                      }

                      if (ip.isEmpty()) continue
                      val base = if (ip.startsWith("http://") || ip.startsWith("https://")) ip else "http://$ip:$port"

                      for (rawCh in chList) {
                          val chNum = rawCh.trim().toIntOrNull() ?: continue
                          val url = when (type) {
                              "dahua" -> "$base/cgi-bin/snapshot.cgi?channel=$chNum"
                              else -> "$base/ISAPI/Streaming/channels/${chNum}01/picture"
                          }
                          channels.add(JSONObject().apply {
                              put("key", "dev_${d}_ch_$chNum")
                              put("title", "$devName · CH$chNum")
                              put("url", url)
                              put("user", user)
                              put("pass", pass)
                          })
                      }
                  }
                  return channels
              }

              private fun pollAllIpCameras(cfg: JSONObject) {
                  val channels = collectAllIpChannels(cfg)
                  val validKeys = channels.map { it.optString("key") }.toSet()
                  ipGridMeta.keys.retainAll(validKeys)
                  ipGridFrames.keys.retainAll(validKeys)

                  for (chObj in channels) {
                      val key = chObj.optString("key")
                      val title = chObj.optString("title")
                      val url = chObj.optString("url")
                      val user = chObj.optString("user")
                      val pass = chObj.optString("pass")

                      networkExecutor.execute {
                          try {
                              val bytes = CameraAuthClient.fetchSnapshotBytes(url, user, pass)
                              val meta = JSONObject().apply {
                                  put("key", key)
                                  put("title", title)
                                  put("online", bytes != null && bytes.isNotEmpty())
                                  put("ts", System.currentTimeMillis())
                              }
                              ipGridMeta[key] = meta

                              if (bytes == null || bytes.isEmpty()) return@execute
                              ipGridFrames[key] = bytes
                              latestIpPreviewJpeg.set(bytes)

                              val bmp = BitmapFactory.decodeByteArray(bytes, 0, bytes.size) ?: return@execute
                              val currGray = bitmapToGray48x36(bmp)
                              val prev = prevIpGrayMap.put(key, currGray)
                              if (prev == null || !isWithinSchedule(cfg)) return@execute

                              val sens = cfg.optInt("sens", 28).coerceIn(5, 95)
                              val pixelThresh = (110 - sens).coerceIn(12, 85)
                              val ratioThresh = ((105 - sens) * 0.0018).coerceIn(0.015, 0.25)

                              var changed = 0
                              for (i in currGray.indices) {
                                  val d = abs((currGray[i].toInt() and 0xFF) - (prev[i].toInt() and 0xFF))
                                  if (d > pixelThresh) changed++
                              }
                              val ratio = changed.toDouble() / currGray.size.toDouble()
                              if (ratio >= ratioThresh) {
                                  val cool = cfg.optInt("cool", 10).coerceIn(3, 600)
                                  val now = System.currentTimeMillis()
                                  val last = lastAlertMsMap[key] ?: 0L
                                  if (now - last >= cool * 1000L) {
                                      lastAlertMsMap[key] = now
                                      handleMotionWithAiAndZoom(cfg, title, bytes, ratio, isPhone = false)
                                  }
                              }
                          } catch (_: Exception) {
                          }
                      }
                  }
              }

              private fun captureAndSendBurst(cfg: JSONObject) {
