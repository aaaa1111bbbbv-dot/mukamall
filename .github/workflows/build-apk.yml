          class MonitorForegroundService : Service(), LifecycleOwner, SensorEventListener {

              companion object {
                  const val CHANNEL_ID = "qoriqlash_pro_channel"
                  const val NOTIF_ID = 4109

                  const val ACTION_START = "uz.qoriqlash.app.START"
                  const val ACTION_STOP = "uz.qoriqlash.app.STOP"
                  const val ACTION_BURST = "uz.qoriqlash.app.BURST"
                  const val ACTION_SHOT = "uz.qoriqlash.app.SHOT"
                  const val ACTION_VIDEO_NOW = "uz.qoriqlash.app.VIDEO_NOW"
                  const val ACTION_CLEAR_LOG = "uz.qoriqlash.app.CLEAR_LOG"

                  @Volatile var isRunning = false
                  @Volatile var isBurstRunning = false
                  @Volatile var burstSentCount = 0
                  @Volatile var lastStatusText = "Tayyor"
                  @Volatile var eventsJson = "[]"
                  @Volatile var lastRecognizedPerson = ""
                  @Volatile var countEnterToday = 0
                  @Volatile var countExitToday = 0

                  val previewSurfaceProvider = AtomicReference<Preview.SurfaceProvider?>(null)
                  val uiVisible = AtomicBoolean(false)
                  val latestFullJpeg = AtomicReference<ByteArray?>(null)
                  val latestIpPreviewJpeg = AtomicReference<ByteArray?>(null)

                  val ipGridFrames = ConcurrentHashMap<String, ByteArray>()
                  val ipGridMeta = ConcurrentHashMap<String, JSONObject>()

                  @Volatile private var activeInstance: MonitorForegroundService? = null

                  fun rebindCameraIfRunning() {
                      activeInstance?.let { svc ->
                          Handler(Looper.getMainLooper()).post { svc.bindPhoneCamera() }
                      }
                  }

                  fun buildGridSnapshotJson(): String {
                      val arr = JSONArray()
                      val sortedKeys = ipGridMeta.keys.toList().sorted()
                      for (key in sortedKeys) {
                          val meta = ipGridMeta[key] ?: continue
                          val bytes = ipGridFrames[key]
                          val item = JSONObject(meta.toString())
                          item.put("b64", if (bytes != null && bytes.isNotEmpty()) {
                              android.util.Base64.encodeToString(bytes, android.util.Base64.NO_WRAP)
                          } else "")
                          arr.put(item)
                      }
                      return arr.toString()
                  }
              }

              private lateinit var lifecycleRegistry: LifecycleRegistry
              override val lifecycle: Lifecycle get() = lifecycleRegistry

              private val mainHandler = Handler(Looper.getMainLooper())
              private val cameraExecutor = Executors.newSingleThreadExecutor()
              private val networkExecutor = Executors.newCachedThreadPool()

              private val httpClient = OkHttpClient.Builder()
                  .connectTimeout(7, TimeUnit.SECONDS)
                  .readTimeout(12, TimeUnit.SECONDS)
                  .writeTimeout(15, TimeUnit.SECONDS)
                  .build()

              private val objectDetector by lazy {
                  val opts = ObjectDetectorOptions.Builder()
                      .setDetectorMode(ObjectDetectorOptions.SINGLE_IMAGE_MODE)
                      .enableClassification()
                      .build()
                  ObjectDetection.getClient(opts)
              }

              private var wakeLock: PowerManager.WakeLock? = null
              private var cameraProvider: ProcessCameraProvider? = null
              private var activeCameraLens = "back"
              private var prevPhoneGray: ByteArray? = null
              private val prevIpGrayMap = ConcurrentHashMap<String, ByteArray>()
              private val lastAlertMsMap = ConcurrentHashMap<String, Long>()
              @Volatile private var lastFrameConvertMs = 0L
              @Volatile private var lastFrameAnalyzeMs = 0L

              private val ringBufferLock = Any()
              private val rollingFrames = ArrayDeque<ByteArray>()
              private val recordingClip = AtomicBoolean(false)

              private var sensorManager: SensorManager? = null
              private var lastAccel = 9.8f
              private var lastTamperMs = 0L
              private var wasCharging = false
              private var lastPowerAlertMs = 0L

              private var audioDetector: DangerAudioDetector? = null
              private var manualStopped = false
