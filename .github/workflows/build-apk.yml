          package uz.qoriqlash.app

          import android.content.Context
          import org.json.JSONObject
          import java.io.File

          object OfflineQueue {
              private const val MAX_ITEMS = 45

              private fun dir(ctx: Context): File {
                  val d = File(ctx.filesDir, "offline_alerts")
                  if (!d.exists()) d.mkdirs()
                  return d
              }

              @Synchronized
              fun enqueuePhoto(ctx: Context, caption: String, jpegBytes: ByteArray) {
                  try {
                      val folder = dir(ctx)
                      val existing = folder.listFiles { f -> f.extension == "jpg" }?.sortedBy { it.lastModified() } ?: emptyList()
                      if (existing.size >= MAX_ITEMS) {
                          val oldest = existing.first()
                          File(folder, "${oldest.nameWithoutExtension}.json").delete()
                          oldest.delete()
                      }
                      val stamp = System.currentTimeMillis().toString()
                      File(folder, "$stamp.jpg").writeBytes(jpegBytes)
                      val meta = JSONObject().apply {
                          put("caption", caption)
                          put("ts", stamp)
                      }
                      File(folder, "$stamp.json").writeText(meta.toString())
                  } catch (_: Exception) {
                  }
              }

              @Synchronized
              fun size(ctx: Context): Int {
                  return dir(ctx).listFiles { f -> f.extension == "jpg" }?.size ?: 0
              }

              @Synchronized
              fun peekOldest(ctx: Context): Triple<File, File, String>? {
                  val folder = dir(ctx)
                  val oldest = folder.listFiles { f -> f.extension == "jpg" }?.minByOrNull { it.lastModified() } ?: return null
                  val metaFile = File(folder, "${oldest.nameWithoutExtension}.json")
                  val caption = try {
                      if (metaFile.exists()) JSONObject(metaFile.readText()).optString("caption", "Oflayn xabar")
                      else "Oflayn xabar"
                  } catch (_: Exception) {
                      "Oflayn xabar"
                  }
                  return Triple(oldest, metaFile, caption)
              }
          }
