                          }
                          activity.startService(i)
                      }
                  }

                  @JavascriptInterface
                  fun promptBiometric(purpose: String) {
                      activity.runOnUiThread {
                          try {
                              val bm = BiometricManager.from(activity)
                              val canAuth = bm.canAuthenticate(BiometricManager.Authenticators.BIOMETRIC_WEAK)
                              if (canAuth != BiometricManager.BIOMETRIC_SUCCESS) {
                                  webView.evaluateJavascript("window.onBioResult('$purpose', false);", null)
                                  return@runOnUiThread
                              }
                              val executor = ContextCompat.getMainExecutor(activity)
                              val prompt = BiometricPrompt(
                                  activity,
                                  executor,
                                  object : BiometricPrompt.AuthenticationCallback() {
                                      override fun onAuthenticationSucceeded(result: BiometricPrompt.AuthenticationResult) {
                                          webView.evaluateJavascript("window.onBioResult('$purpose', true);", null)
                                      }
                                      override fun onAuthenticationError(errorCode: Int, errString: CharSequence) {
                                          webView.evaluateJavascript("window.onBioResult('$purpose', false);", null)
                                      }
                                  }
                              )
                              val info = BiometricPrompt.PromptInfo.Builder()
                                  .setTitle("Qo‘riqlash tasdig‘i")
                                  .setSubtitle("Barmoq izi yoki yuz bilan tasdiqlang")
                                  .setNegativeButtonText("PIN kiritish")
                                  .build()
                              prompt.authenticate(info)
                          } catch (_: Exception) {
                              webView.evaluateJavascript("window.onBioResult('$purpose', false);", null)
                          }
                      }
                  }

                  @JavascriptInterface
                  fun detectChatId(token: String) {
                      Thread {
                          var foundId = ""
                          var foundUser = ""
                          try {
                              val client = OkHttpClient.Builder()
                                  .connectTimeout(5, TimeUnit.SECONDS)
                                  .readTimeout(8, TimeUnit.SECONDS)
                                  .build()
                              val req = Request.Builder()
                                  .url("https://api.telegram.org/bot${token.trim()}/getUpdates?limit=20")
                                  .build()
                              client.newCall(req).execute().use { resp ->
                                  if (resp.isSuccessful) {
                                      val root = JSONObject(resp.body?.string() ?: "")
                                      if (root.optBoolean("ok", false)) {
                                          val arr = root.optJSONArray("result") ?: JSONArray()
                                          for (i in arr.length() - 1 downTo 0) {
                                              val item = arr.optJSONObject(i) ?: continue
                                              val msg = item.optJSONObject("message") ?: item.optJSONObject("channel_post") ?: continue
                                              val chat = msg.optJSONObject("chat") ?: continue
                                              val id = chat.optLong("id", 0L)
                                              if (id != 0L) {
                                                  foundId = id.toString()
                                                  foundUser = chat.optString("username", chat.optString("first_name", ""))
                                                  break
                                              }
                                          }
                                      }
                                  }
                              }
                          } catch (_: Exception) {
                          }
                          val escId = foundId.replace("'", "")
                          val escUser = foundUser.replace("\\", "\\\\").replace("'", "\\'")
                          activity.runOnUiThread {
                              webView.evaluateJavascript("window.onChatIdDetected('$escId', '$escUser');", null)
                          }
                      }.start()
                  }

                  @JavascriptInterface
                  fun setPreviewRect(visible: Boolean, leftDp: Float, topDp: Float, widthDp: Float, heightDp: Float) {
                      activity.runOnUiThread {
                          if (!visible || widthDp <= 1f || heightDp <= 1f) {
                              previewView.visibility = View.GONE
                              return@runOnUiThread
                          }
                          val d = activity.resources.displayMetrics.density
                          val lp = FrameLayout.LayoutParams(
                              (widthDp * d).toInt(),
                              (heightDp * d).toInt(),
                              Gravity.TOP or Gravity.START
                          ).apply {
                              leftMargin = (leftDp * d).toInt()
                              topMargin = (topDp * d).toInt()
                          }
                          previewView.layoutParams = lp
                          if (previewView.visibility != View.VISIBLE) previewView.visibility = View.VISIBLE
                      }
                  }

                  @JavascriptInterface
                  fun requestIgnoreBattery() {
                      activity.runOnUiThread {
                          try {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                                  val pm = activity.getSystemService(Context.POWER_SERVICE) as PowerManager
                                  if (!pm.isIgnoringBatteryOptimizations(activity.packageName)) {
                                      val i = Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS).apply {
                                          data = Uri.parse("package:${activity.packageName}")
                                      }
                                      activity.startActivity(i)
                                  }
                              }
                          } catch (_: Exception) {
                          }
                      }
                  }

                  @JavascriptInterface
                  fun startOrUpdateBgMonitor(configJson: String) {
                      if (!SecureStore.isRemoteActive(activity)) return
                      SecureStore.saveConfigJson(activity, configJson)
                      SecureStore.setWasRunning(activity, true)
                      activity.runOnUiThread {
                          val startIntent = Intent(activity, MonitorForegroundService::class.java).apply {
                              action = MonitorForegroundService.ACTION_START
                          }
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              activity.startForegroundService(startIntent)
                          } else {
                              activity.startService(startIntent)
                          }
                      }
                  }

                  @JavascriptInterface
                  fun stopBgMonitor() {
                      SecureStore.setWasRunning(activity, false)
                      activity.runOnUiThread {
                          previewView.visibility = View.GONE
                          activity.startService(Intent(activity, MonitorForegroundService::class.java).apply {
                              action = MonitorForegroundService.ACTION_STOP
                          })
                      }
                  }

                  @JavascriptInterface
                  fun bgShotNow() {
                      activity.runOnUiThread {
                          activity.startService(Intent(activity, MonitorForegroundService::class.java).apply {
                              action = MonitorForegroundService.ACTION_SHOT
                          })
                      }
                  }

                  @JavascriptInterface
                  fun clearNativeEvents() {
                      activity.runOnUiThread {
                          activity.startService(Intent(activity, MonitorForegroundService::class.java).apply {
                              action = MonitorForegroundService.ACTION_CLEAR_LOG
                          })
                      }
                  }

                  @JavascriptInterface
                  fun getNativeEvents(): String = MonitorForegroundService.eventsJson

                  @JavascriptInterface
                  fun getBgState(): String {
                      val o = JSONObject()
                      o.put("running", MonitorForegroundService.isRunning)
                      o.put("burst", MonitorForegroundService.isBurstRunning)
                      o.put("burstCount", MonitorForegroundService.burstSentCount)
                      o.put("status", MonitorForegroundService.lastStatusText)
                      o.put("person", MonitorForegroundService.lastRecognizedPerson)
                      o.put("enter", MonitorForegroundService.countEnterToday)
                      o.put("exit", MonitorForegroundService.countExitToday)
                      o.put("queueSize", OfflineQueue.size(activity))
                      return o.toString()
                  }
              }
          }
