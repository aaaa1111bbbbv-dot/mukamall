                      val lp = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                      lp.setMargins(0, 20, 0, 0)
                      layoutParams = lp

                      val lockLabel = TextView(this@AdminActivity).apply {
                          text = "🔒 Token AES-256 bilan shifrlangan"
                          setTextColor(Color.parseColor("#6EE7B7"))
                          textSize = 13f
                          setTypeface(null, Typeface.BOLD)
                          layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                      }
                      addView(lockLabel)

                      val changeBtn = Button(this@AdminActivity).apply {
                          text = "Almashtirish"
                          textSize = 11f
                          setBackgroundColor(Color.parseColor("#0F172A"))
                          setTextColor(Color.parseColor("#38BDF8"))
                          setOnClickListener {
                              tokenLockedBox.visibility = View.GONE
                              tokenInputBox.visibility = View.VISIBLE
                          }
                      }
                      addView(changeBtn)
                  }
                  layout.addView(tokenLockedBox)

                  // Birinchi marta token kiritish oynasi
                  tokenInputBox = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                  }
                  tokenInputBox.addView(makeLabel("GitHub Token (bir marta kiritiladi va shifrlanadi):"))
                  tokenInput = makeInput("ghp_xxxxxxxxxxxxxxxxxxxx").apply {
                      inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD
                  }
                  tokenInputBox.addView(tokenInput)

                  val saveTokBtn = Button(this).apply {
                      text = "🔐 SHIFRLAB SAQLASH"
                      setBackgroundColor(Color.parseColor("#10B981"))
                      setTextColor(Color.WHITE)
                      val lp = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                      lp.setMargins(0, 14, 0, 0)
                      layoutParams = lp
                      setOnClickListener {
                          val t = tokenInput.text.toString().trim()
                          if (t.isNotEmpty()) {
                              vaultPrefs.edit().putString("gh_token_enc", t).apply()
                              tokenInput.setText("")
                              updateTokenVisibility()
                              fetchUsers()
                          }
                      }
                  }
                  tokenInputBox.addView(saveTokBtn)
                  layout.addView(tokenInputBox)

                  val refreshBtn = Button(this).apply {
                      text = "🔄 MIJOZLAR RO‘YXATINI YANGILASH"
                      setBackgroundColor(Color.parseColor("#0284C7"))
                      setTextColor(Color.WHITE)
                      val lp = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                      lp.setMargins(0, 22, 0, 24)
                      layoutParams = lp
                      setOnClickListener { fetchUsers() }
                  }
                  layout.addView(refreshBtn)

                  val listHeader = TextView(this).apply {
                      text = "📋 RO‘YXATDAN O‘TGAN MIJOZLAR:"
                      setTextColor(Color.parseColor("#00F0FF"))
                      textSize = 14f
                      setTypeface(null, Typeface.BOLD)
                      setPadding(0, 6, 0, 16)
                  }
                  layout.addView(listHeader)

                  usersContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                  }
                  layout.addView(usersContainer)

                  setContentView(scroll)
                  updateTokenVisibility()
                  fetchUsers()
              }

              private fun updateTokenVisibility() {
                  val hasToken = getSavedToken().isNotEmpty()
                  tokenLockedBox.visibility = if (hasToken) View.VISIBLE else View.GONE
                  tokenInputBox.visibility = if (hasToken) View.GONE else View.VISIBLE
              }

              private fun makeLabel(t: String): TextView = TextView(this).apply {
                  text = t
                  setTextColor(Color.LTGRAY)
                  setPadding(0, 16, 0, 6)
              }

              private fun makeInput(hintText: String): EditText = EditText(this).apply {
                  hint = hintText
                  setHintTextColor(Color.GRAY)
                  setTextColor(Color.WHITE)
                  setBackgroundColor(Color.parseColor("#111827"))
                  setPadding(24, 24, 24, 24)
              }

              private fun fetchUsers() {
                  val tok = getSavedToken()
                  if (tok.isEmpty()) {
                      statusText.text = "Avval GitHub Token (ghp_...) ni bir marta kiriting"
                      return
                  }
                  statusText.text = "Mijozlar yuklanmoqda..."

                  Thread {
                      try {
                          val req = Request.Builder()
                              .url("$USERS_API_URL?t=${System.currentTimeMillis()}")
                              .header("Authorization", "token $tok")
                              .header("Accept", "application/vnd.github.v3+json")
                              .build()

                          client.newCall(req).execute().use { resp ->
                              if (resp.isSuccessful) {
                                  val body = JSONObject(resp.body?.string() ?: "{}")
                                  usersSha = body.optString("sha", "")
                                  val b64 = body.optString("content", "").replace("\n", "")
                                  val decoded = String(Base64.decode(b64, Base64.DEFAULT), Charsets.UTF_8)
                                  val root = JSONObject(decoded)
                                  usersArray = root.optJSONArray("users") ?: JSONArray()

                                  runOnUiThread {
                                      statusText.text = "✅ Baza yangilandi (Shifrlangan ulanish)"
                                      statusText.setTextColor(Color.parseColor("#10B981"))
                                      renderUsersList()
                                  }
                              } else {
                                  val code = resp.code
                                  runOnUiThread {
                                      statusText.text = "❌ Xatolik ($code): Token yoki users.json faylini tekshiring"
                                      statusText.setTextColor(Color.parseColor("#F43F5E"))
                                  }
                              }
                          }
                      } catch (e: Exception) {
                          runOnUiThread {
                              statusText.text = "❌ Tarmoq xatosi: ${e.message}"
                              statusText.setTextColor(Color.parseColor("#F43F5E"))
                          }
                      }
                  }.start()
              }

              private fun renderUsersList() {
                  usersContainer.removeAllViews()
                  val total = usersArray.length()
                  var activeCount = 0
                  var runningNowCount = 0

                  for (i in 0 until total) {
                      val u = usersArray.optJSONObject(i) ?: continue
                      val isAct = u.optBoolean("active", true)
                      val isMon = u.optBoolean("monitoring", false)
                      if (isAct) activeCount++
                      if (isAct && isMon) runningNowCount++

                      usersContainer.addView(buildUserCard(i, u))
                  }

                  statsText.text = "Jami: $total ta  |  Faol: $activeCount ta  |  Onlayn: $runningNowCount ta"
                  if (total == 0) {
                      val empty = TextView(this).apply {
                          text = "Hali birorta mijoz ilovaga kirmagan."
                          setTextColor(Color.GRAY)
                          setPadding(16, 24, 16, 24)
                      }
                      usersContainer.addView(empty)
                  }
              }

              private fun buildUserCard(index: Int, u: JSONObject): LinearLayout {
                  val isAct = u.optBoolean("active", true)
                  val isMon = u.optBoolean("monitoring", false)
                  val name = u.optString("name", "Nomsiz mijoz")
                  val phone = u.optString("phone", "")
                  val id = u.optString("id", "")
                  val model = u.optString("model", "")
                  val regAt = u.optString("registeredAt", "-")
                  val lastSeen = u.optString("lastSeen", "-")
                  val expiresAt = u.optString("expiresAt", "Cheksiz")

                  val cardBg = GradientDrawable().apply {
                      setColor(Color.parseColor("#0F172A"))
                      cornerRadius = 26f
                      setStroke(3, if (isAct) Color.parseColor("#00F0FF") else Color.parseColor("#F43F5E"))
                  }

                  return LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = cardBg
                      setPadding(32, 28, 32, 28)
                      val lp = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                      lp.setMargins(0, 0, 0, 24)
                      layoutParams = lp

                      val head = TextView(this@AdminActivity).apply {
                          text = "${index + 1}. $name ${if (phone.isNotEmpty()) "($phone)" else ""}"
                          setTextColor(Color.WHITE)
                          textSize = 17f
                          setTypeface(null, Typeface.BOLD)
                      }
                      addView(head)

                      val info = TextView(this@AdminActivity).apply {
                          text = buildString {
                              appendLine("🆔 ID: $id  |  📱 $model")
                              appendLine("📅 Ro‘yxatdan o‘tgan: $regAt")
                              appendLine("🕒 Oxirgi faollik: $lastSeen")
                              appendLine("⏳ Obuna muddati: $expiresAt")
                              append("📡 Nazorat holati: ${if (isMon) "ISHLAYAPTI 🟢" else "KUTISHDA ⚪"}")
                          }
                          setTextColor(Color.parseColor("#CBD5E1"))
                          textSize = 13f
                          setPadding(0, 12, 0, 16)
                      }
                      addView(info)

                      val sw = Switch(this@AdminActivity).apply {
                          text = if (isAct) "✅ Obuna FAOL (Faqat shu mijoz uchun)" else "⛔ Obuna O‘CHIRILGAN (Bloklangan)"
                          setTextColor(if (isAct) Color.parseColor("#10B981") else Color.parseColor("#F43F5E"))
                          textSize = 14f
                          isChecked = isAct
                          setOnCheckedChangeListener { _, checked ->
                              u.put("active", checked)
                              if (!checked) {
                                  u.put("note", "To‘lov muddati tugagani sababli obunangiz to‘xtatildi.")
                              } else {
                                  u.put("note", "")
                              }
                              saveUsersToGitHub("Mijoz holati o‘zgartirildi: $name -> $checked")
                          }
                      }
                      addView(sw)

                      val btnRow = LinearLayout(this@AdminActivity).apply {
                          orientation = LinearLayout.HORIZONTAL
                          setPadding(0, 16, 0, 0)
                      }

                      val plus30Btn = Button(this@AdminActivity).apply {
                          text = "➕ +30 kun uzaytirish"
                          setBackgroundColor(Color.parseColor("#10B981"))
                          setTextColor(Color.WHITE)
                          textSize = 12f
                          layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f).apply {
                              setMargins(0, 0, 12, 0)
                          }
                          setOnClickListener {
                              val nextExp = extendDaysFromNow(30)
                              u.put("expiresAt", nextExp)
                              u.put("active", true)
                              u.put("note", "")
                              saveUsersToGitHub("$name obunasi $nextExp gacha uzaytirildi")
                          }
                      }
                      btnRow.addView(plus30Btn)

                      val editDateBtn = Button(this@AdminActivity).apply {
                          text = "📅 Muddat / Xabar"
                          setBackgroundColor(Color.parseColor("#334155"))
                          setTextColor(Color.WHITE)
                          textSize = 12f
                          layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                          setOnClickListener { showEditUserDialog(u) }
                      }
                      btnRow.addView(editDateBtn)

                      addView(btnRow)
                  }
              }

              private fun extendDaysFromNow(days: Int): String {
                  val cal = Calendar.getInstance().apply { add(Calendar.DAY_OF_YEAR, days) }
                  return SimpleDateFormat("yyyy-MM-dd", Locale.US).format(cal.time)
              }

              private fun showEditUserDialog(u: JSONObject) {
                  val box = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(40, 24, 40, 10)
                  }
                  val dateIn = EditText(this).apply {
                      hint = "Tugash sanasi (YYYY-MM-DD)"
                      setText(u.optString("expiresAt", extendDaysFromNow(30)))
                  }
                  val noteIn = EditText(this).apply {
                      hint = "Shaxsiy ogohlantirish xabari"
                      setText(u.optString("note", ""))
                  }
                  box.addView(dateIn)
                  box.addView(noteIn)

                  AlertDialog.Builder(this)
                      .setTitle(u.optString("name", "Mijoz sozlamasi"))
                      .setView(box)
                      .setPositiveButton("Saqlash") { _, _ ->
                          u.put("expiresAt", dateIn.text.toString().trim())
                          u.put("note", noteIn.text.toString().trim())
                          saveUsersToGitHub("Mijoz muddati yangilandi")
                      }
                      .setNegativeButton("Bekor qilish", null)
                      .show()
              }

              private fun saveUsersToGitHub(commitMsg: String) {
                  val tok = getSavedToken()
                  if (tok.isEmpty()) return
                  statusText.text = "Saqlanmoqda..."

                  Thread {
                      try {
                          val root = JSONObject().apply { put("users", usersArray) }
                          val encoded = Base64.encodeToString(root.toString(2).toByteArray(Charsets.UTF_8), Base64.NO_WRAP)
                          val body = JSONObject().apply {
                              put("message", commitMsg)
                              put("content", encoded)
                              put("sha", usersSha)
                          }
                          val req = Request.Builder()
                              .url(USERS_API_URL)
                              .header("Authorization", "token $tok")
                              .header("Accept", "application/vnd.github.v3+json")
                              .put(body.toString().toRequestBody("application/json; charset=utf-8".toMediaType()))
                              .build()

                          client.newCall(req).execute().use { resp ->
                              if (resp.isSuccessful) {
                                  val res = JSONObject(resp.body?.string() ?: "{}")
                                  usersSha = res.optJSONObject("content")?.optString("sha", usersSha) ?: usersSha
                                  runOnUiThread {
                                      statusText.text = "✅ $commitMsg"
                                      statusText.setTextColor(Color.parseColor("#10B981"))
                                      renderUsersList()
                                  }
                              } else {
                                  runOnUiThread {
                                      Toast.makeText(this, "Saqlashda xatolik: ${resp.code}", Toast.LENGTH_SHORT).show()
                                      fetchUsers()
                                  }
                              }
                          }
                      } catch (e: Exception) {
                          runOnUiThread {
                              statusText.text = "❌ Xatolik: ${e.message}"
                          }
                      }
                  }.start()
              }
          }
          EOF

          if [ -n "$GH_SECRET_TOKEN" ]; then
            sed -i "s|__GH_SECRET_PLACEHOLDER__|$GH_SECRET_TOKEN|g" admin/src/main/java/uz/qoriqlash/admin/AdminActivity.kt
          fi

      - name: Build both APKs (Client + Admin)
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Client & Admin APKs
        uses: actions/upload-artifact@v4
        with:
          name: Qoriqlash-Mukamal-APKs
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            admin/build/outputs/apk/debug/admin-debug.apk
          if-no-files-found: error
