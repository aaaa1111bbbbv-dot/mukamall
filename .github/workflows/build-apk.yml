              <!-- AQLLI XAVFSIZLIK FUNKSIYALARI -->
              <div class="card">
                <div class="card-title"><span>4. Aqlli Xavfsizlik va Jadval</span></div>
                <div class="chk-row"><span>Avto-Zoom (obyektni yaqinlashtirish)</span><input id="cfgZoom" type="checkbox" checked /></div>
                <div class="chk-row"><span>Xavfda 10 soniyali video yuborish</span><input id="cfgAutoVideo" type="checkbox" checked /></div>
                <div class="chk-row"><span>Eshikdan kirish-chiqish hisobi</span><input id="cfgDoor" type="checkbox" checked /></div>
                <div class="chk-row"><span>Tovush trevogasi (shisha/qichqiriq)</span><input id="cfgAudio" type="checkbox" checked /></div>
                <div class="chk-row"><span>Buzg‘unchilik nazorati (silkitish/yopish)</span><input id="cfgTamper" type="checkbox" checked /></div>
                <div class="chk-row"><span>220V elektr uzilishi nazorati</span><input id="cfgPower" type="checkbox" checked /></div>
                <div class="chk-row"><span>Mahalliy sirena ovozi</span><input id="cfgSiren" type="checkbox" /></div>
                <div class="chk-row"><span>Jadval bo‘yicha qo‘riqlash</span><input id="cfgSchedOn" type="checkbox" /></div>
                <div class="row">
                  <div style="flex:1;"><label>Boshlanish:</label><input id="cfgSchedStart" type="time" value="22:00" /></div>
                  <div style="flex:1;"><label>Tugash:</label><input id="cfgSchedEnd" type="time" value="07:00" /></div>
                </div>
              </div>

              <!-- TANISH YUZLAR (WHITELIST) -->
              <div class="card">
                <div class="card-title"><span>5. Tanish Yuzlar (Signal bermaydi)</span></div>
                <div class="row">
                  <input id="faceNameInput" style="flex:2;" placeholder="Ism (masalan: O'zim)" />
                  <button class="btn btn-accent" style="flex:1;padding:10px;" onclick="enrollFaceNow()">Kameradan olish</button>
                </div>
                <div id="facesList" style="margin-top:8px;"></div>
              </div>

              <!-- ADMIN SERVER VA PIN -->
              <div class="card">
                <div class="card-title"><span>6. Server Tokeni va PIN</span></div>
                <div id="tokenLockedView" class="locked-box" style="display:none;">
                  <span>🔒 Server tokeni shifrlangan va saqlangan</span>
                  <button style="background:#1e293b;color:#38bdf8;border:1px solid #38bdf8;border-radius:8px;padding:5px 9px;font-size:11px;" onclick="unlockTokenEdit()">Almashtirish</button>
                </div>
                <div id="tokenEditView">
                  <label>Admin Server Token (bir marta kiritiladi):</label>
                  <div class="row" style="margin-top:4px;">
                    <input id="customTokenInput" type="password" style="flex:2;" placeholder="ghp_..." />
                    <button class="btn btn-accent" style="flex:1;padding:10px;" onclick="saveServerToken()">Saqlash</button>
                  </div>
                </div>
                <div class="row">
                  <input id="newPinInput" type="password" inputmode="numeric" style="flex:2;" placeholder="Yangi PIN (4+ raqam)" />
                  <button class="btn btn-sec" style="flex:1;padding:10px;" onclick="saveNewPin()">PIN qo‘yish</button>
                </div>
                <div class="row">
                  <button class="btn btn-sec" onclick="Android.requestIgnoreBattery()">🔋 Batareya cheklovini o‘chirish</button>
                </div>
              </div>

              <div class="row" style="padding:0 14px;">
                <button class="btn btn-start" onclick="saveAndCloseSettings()">💾 SAQLASH VA YOPISH</button>
              </div>
            </div>

          <script>
            let devices = [];
            let settingsUnlocked = false;
            let lastRectKey = "";
            let lastEventsRaw = "";
            let lastGridRaw = "";

            function setTokenUiLocked(locked) {
              document.getElementById('tokenLockedView').style.display = locked ? 'flex' : 'none';
              document.getElementById('tokenEditView').style.display = locked ? 'none' : 'block';
            }

            function unlockTokenEdit() {
              setTokenUiLocked(false);
            }

            function initApp() {
              const devId = Android.getDeviceId();
              document.getElementById('regDevId').innerText = "Qurilma ID: " + devId;
              document.getElementById('blockDevId').innerText = "Sizning ID: " + devId;

              const prof = JSON.parse(Android.getClientProfile() || "{}");
              setTokenUiLocked(!!prof.tokenLocked);

              if (!prof.name) {
                document.getElementById('registerOverlay').classList.add('show');
              } else {
                updateHeaderSub(prof);
                Android.checkRemoteControl();
              }

              if (!Android.isCreatorActivated()) {
                document.getElementById('creatorOverlay').classList.add('show');
              }

              loadCfgToUi();
              refreshFaces();
              setInterval(syncUiLoop, 2200);
            }

            function updateHeaderSub(prof) {
              const exp = prof.expiresAt ? (" · Obuna: " + prof.expiresAt) : "";
              document.getElementById('subHeaderInfo').innerText = (prof.name || "Mijoz") + " (" + prof.id + ")" + exp;
            }

            function submitRegistration() {
              const n = document.getElementById('regName').value.trim();
              const p = document.getElementById('regPhone').value.trim();
              if (!n) { alert("Iltimos, ismingizni kiriting!"); return; }
              Android.registerClientProfile(n, p);
              document.getElementById('registerOverlay').classList.remove('show');
              const prof = JSON.parse(Android.getClientProfile() || "{}");
              updateHeaderSub(prof);
            }

            function saveServerToken() {
              const t = document.getElementById('customTokenInput').value.trim();
              if (!t) return;
              Android.saveCustomServerToken(t);
              document.getElementById('customTokenInput').value = '';
              setTokenUiLocked(true);
            }

            function verifyCreator() {
              const code = document.getElementById('creatorCodeInput').value;
              if (Android.activateCreatorCode(code)) {
                document.getElementById('creatorOverlay').classList.remove('show');
              } else {
                alert("Kod noto‘g‘ri!");
              }
            }

            window.onRemoteControlUpdated = function(active, msg, exp, syncSt, tokOk) {
              const ov = document.getElementById('blockOverlay');
              if (!active) {
                document.getElementById('blockReason').innerText = msg || "Obuna muddatingiz tugagan.";
                ov.classList.add('show');
              } else {
                ov.classList.remove('show');
              }
              if (syncSt) {
                document.getElementById('serverSyncBadge').innerText = syncSt;
              }
              if (tokOk) setTokenUiLocked(true);
              const prof = JSON.parse(Android.getClientProfile() || "{}");
              if (exp) prof.expiresAt = exp;
              updateHeaderSub(prof);
            };

            function recheckSub() {
              Android.checkRemoteControl();
            }

            function toggleSettings() {
              const sv = document.getElementById('settingsView');
              const mv = document.getElementById('mainView');
              if (sv.style.display === 'none') {
                if (Android.hasPin() && !settingsUnlocked) {
                  document.getElementById('pinOverlay').classList.add('show');
                  Android.promptBiometric('settings');
                  return;
                }
                sv.style.display = 'block';
                mv.style.display = 'none';
                lastRectKey = "off";
                Android.setPreviewRect(false, 0, 0, 0, 0);
              } else {
                sv.style.display = 'none';
                mv.style.display = 'block';
              }
            }

            window.onBioResult = function(purpose, ok) {
              if (ok && purpose === 'settings') {
                settingsUnlocked = true;
                document.getElementById('pinOverlay').classList.remove('show');
                toggleSettings();
              }
            };

            function checkPinNow() {
              const val = document.getElementById('pinInput').value;
              if (Android.verifyPin(val)) {
                settingsUnlocked = true;
                document.getElementById('pinOverlay').classList.remove('show');
                document.getElementById('pinInput').value = '';
                toggleSettings();
              } else {
                alert("PIN noto‘g‘ri!");
              }
            }

            function saveNewPin() {
              const p = document.getElementById('newPinInput').value.trim();
              if (Android.setPin(p)) {
                alert("PIN saqlandi!");
                document.getElementById('newPinInput').value = '';
              } else {
                alert("Kamida 4 ta raqam kiriting");
              }
            }

            function loadCfgToUi() {
              let c = {};
              try { c = JSON.parse(Android.loadSecureConfig() || "{}"); } catch(e) {}
              document.getElementById('cfgMode').value = c.mode || 'phone';
              document.getElementById('cfgLens').value = c.lens || 'back';
              document.getElementById('cfgSens').value = c.sens || 28;
              document.getElementById('cfgCool').value = c.cool || 10;
              document.getElementById('cfgIpSec').value = c.ipSec || 3;
              document.getElementById('cfgToken').value = c.token || '';
              document.getElementById('cfgChatId').value = c.chatId || '';
              document.getElementById('cfgZoom').checked = c.autoZoom !== false;
              document.getElementById('cfgAutoVideo').checked = c.autoVideo !== false;
              document.getElementById('cfgDoor').checked = c.doorCounter !== false;
              document.getElementById('cfgAudio').checked = c.audioAlert !== false;
              document.getElementById('cfgTamper').checked = c.tamperAlert !== false;
              document.getElementById('cfgPower').checked = c.powerAlert !== false;
              document.getElementById('cfgSiren').checked = !!c.siren;
              document.getElementById('cfgSchedOn').checked = !!c.schedEnabled;
              document.getElementById('cfgSchedStart').value = c.schedStart || '22:00';
              document.getElementById('cfgSchedEnd').value = c.schedEnd || '07:00';
              devices = Array.isArray(c.devices) ? c.devices : [];
              renderDevices();
            }

            function collectCfgFromUi() {
              return {
                mode: document.getElementById('cfgMode').value,
                lens: document.getElementById('cfgLens').value,
                sens: parseInt(document.getElementById('cfgSens').value || '28', 10),
                cool: parseInt(document.getElementById('cfgCool').value || '10', 10),
                ipSec: parseInt(document.getElementById('cfgIpSec').value || '3', 10),
                token: document.getElementById('cfgToken').value.trim(),
                chatId: document.getElementById('cfgChatId').value.trim(),
                autoZoom: document.getElementById('cfgZoom').checked,
                autoVideo: document.getElementById('cfgAutoVideo').checked,
                doorCounter: document.getElementById('cfgDoor').checked,
                audioAlert: document.getElementById('cfgAudio').checked,
                tamperAlert: document.getElementById('cfgTamper').checked,
                powerAlert: document.getElementById('cfgPower').checked,
                siren: document.getElementById('cfgSiren').checked,
                schedEnabled: document.getElementById('cfgSchedOn').checked,
                schedStart: document.getElementById('cfgSchedStart').value,
                schedEnd: document.getElementById('cfgSchedEnd').value,
                devices: devices
              };
            }

            function saveAndCloseSettings() {
              const cfg = collectCfgFromUi();
              const json = JSON.stringify(cfg);
              Android.saveSecureConfig(json);
              const st = JSON.parse(Android.getBgState() || "{}");
              if (st.running) Android.startOrUpdateBgMonitor(json);
              toggleSettings();
            }

            function startGuard() {
              const cfg = collectCfgFromUi();
              const json = JSON.stringify(cfg);
              Android.saveSecureConfig(json);
              Android.startOrUpdateBgMonitor(json);
            }

            function stopGuard() {
              Android.stopBgMonitor();
            }

            function addDevicePrompt() {
              devices.push({
                name: "NVR / Kamera #" + (devices.length + 1),
                type: "hikvision",
                ip: "192.168.1.64",
                port: "80",
                user: "admin",
                pass: "",
                channels: "1,2",
                customUrl: ""
              });
              renderDevices();
            }

            function removeDevice(idx) {
              devices.splice(idx, 1);
              renderDevices();
            }

            function renderDevices() {
              const box = document.getElementById('devicesList');
              box.innerHTML = '';
              devices.forEach((d, i) => {
                const div = document.createElement('div');
                div.className = 'dev-card';
                div.innerHTML = `
                  <div class="dev-head">
                    <span>#${i+1} ${d.name}</span>
                    <button style="background:#f43f5e;color:#fff;border:none;border-radius:8px;padding:5px 9px;font-size:11px;" onclick="removeDevice(${i})">O‘chirish</button>
                  </div>
                  <label>Nomi:</label>
                  <input value="${d.name}" onchange="devices[${i}].name=this.value" />
                  <label>Turi:</label>
                  <select onchange="devices[${i}].type=this.value;renderDevices();">
                    <option value="hikvision" ${d.type==='hikvision'?'selected':''}>Hikvision NVR / IP</option>
                    <option value="dahua" ${d.type==='dahua'?'selected':''}>Dahua NVR / IP</option>
                    <option value="url" ${d.type==='url'?'selected':''}>To‘g‘ridan-to‘g‘ri Snapshot URL</option>
                  </select>
                  ${d.type === 'url' ? `
                    <label>Snapshot URL:</label>
                    <input value="${d.customUrl||''}" onchange="devices[${i}].customUrl=this.value" placeholder="http://.../snapshot.jpg" />
                  ` : `
                    <label>IP manzil:</label>
                    <input value="${d.ip||''}" onchange="devices[${i}].ip=this.value" />
                    <label>HTTP Port:</label>
                    <input value="${d.port||'80'}" onchange="devices[${i}].port=this.value" />
                    <label>Kanallar (vergul bilan, masalan: 1,2,3,4):</label>
                    <input value="${d.channels||'1'}" onchange="devices[${i}].channels=this.value" />
                  `}
                  <div class="row">
                    <div style="flex:1;"><label>Login:</label><input value="${d.user||''}" onchange="devices[${i}].user=this.value" /></div>
                    <div style="flex:1;"><label>Parol:</label><input type="password" value="${d.pass||''}" onchange="devices[${i}].pass=this.value" /></div>
                  </div>
                `;
                box.appendChild(div);
              });
            }

            function autoDetectChat() {
              const t = document.getElementById('cfgToken').value.trim();
              if (!t) { alert("Avval Bot Token kiriting!"); return; }
              Android.detectChatId(t);
            }

            window.onChatIdDetected = function(id, user) {
              if (id) {
                document.getElementById('cfgChatId').value = id;
                alert("Chat ID topildi: " + id + " (" + user + ")");
              } else {
                alert("Topilmadi. Telegramda botingizga /start yuborib qayta bosing.");
              }
            };

            function enrollFaceNow() {
              const name = document.getElementById('faceNameInput').value.trim();
              if (!name) { alert("Ism kiriting!"); return; }
              Android.enrollFaceFromCurrentFrame(name);
            }

            window.onFaceEnrolled = function(ok, msg) {
              alert(msg);
              if (ok) {
                document.getElementById('faceNameInput').value = '';
                refreshFaces();
              }
            };

            function refreshFaces() {
              const list = JSON.parse(Android.getKnownFaces() || "[]");
              const box = document.getElementById('facesList');
              box.innerHTML = '';
              list.forEach(f => {
                const row = document.createElement('div');
                row.className = 'chk-row';
                row.innerHTML = `<span>👤 ${f.name}</span><button style="background:#f43f5e;color:#fff;border:none;border-radius:8px;padding:4px 8px;" onclick="Android.removeKnownFace('${f.id}');refreshFaces();">O‘chirish</button>`;
                box.appendChild(row);
              });
            }

            function openZoom(b64, title) {
              document.getElementById('zoomImg').src = "data:image/jpeg;base64," + b64;
              document.getElementById('zoomTitle').innerText = title;
              document.getElementById('zoomModal').classList.add('show');
            }

            function syncUiLoop() {
              const st = JSON.parse(Android.getBgState() || "{}");
              const badge = document.getElementById('statusBadge');
              const dot = document.getElementById('liveDot');
              if (st.running) {
                badge.innerText = "● JONLI FAOL";
                badge.style.color = "#10b981";
                dot.classList.add('active');
              } else {
                badge.innerText = "KUTISHDA";
                badge.style.color = "#94a3b8";
                dot.classList.remove('active');
              }
              document.getElementById('cntIn').innerText = st.enter || 0;
              document.getElementById('cntOut').innerText = st.exit || 0;
              document.getElementById('cntQueue').innerText = st.queueSize || 0;

              const mv = document.getElementById('mainView');
              if (mv.style.display !== 'none' && st.running) {
                const r = document.getElementById('previewAnchor').getBoundingClientRect();
                const rk = Math.round(r.left)+"_"+Math.round(r.top)+"_"+Math.round(r.width)+"_"+Math.round(r.height);
                if (rk !== lastRectKey) {
                  lastRectKey = rk;
                  Android.setPreviewRect(true, r.left, r.top, r.width, r.height);
                }
              } else if (lastRectKey !== "off") {
                lastRectKey = "off";
                Android.setPreviewRect(false, 0, 0, 0, 0);
              }

              const gridRaw = Android.getIpGridFrames() || "[]";
              if (gridRaw !== lastGridRaw) {
                lastGridRaw = gridRaw;
                const frames = JSON.parse(gridRaw);
                document.getElementById('ipCountLabel').innerText = frames.length + " kanal";
                const grid = document.getElementById('ipGrid');
                grid.innerHTML = '';
                frames.forEach(item => {
                  const cell = document.createElement('div');
                  cell.className = 'grid-item';
                  if (item.b64) {
                    cell.innerHTML = `<img src="data:image/jpeg;base64,${item.b64}" /><div class="grid-label">🟢 ${item.title}</div>`;
                    cell.onclick = () => openZoom(item.b64, item.title);
                  } else {
                    cell.innerHTML = `<div style="padding:40px 8px;text-align:center;font-size:11px;color:#64748b;">Ulanmoqda...</div><div class="grid-label">⚪ ${item.title}</div>`;
                  }
                  grid.appendChild(cell);
                });
              }

              const evRaw = Android.getNativeEvents() || "[]";
              if (evRaw !== lastEventsRaw) {
                lastEventsRaw = evRaw;
                const evs = JSON.parse(evRaw);
                const eBox = document.getElementById('eventsBox');
                eBox.innerHTML = evs.slice(0, 15).map(e => `<div class="log-item"><b style="color:#38bdf8;">[${e.time}]</b> ${e.text}</div>`).join('');
              }
            }

            window.onload = initApp;
          </script>
          </body>
          </html>
          EOF

