name: Build Mukamal Client va Admin APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK & Gradle
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$SDK_ROOT"
          echo "sdk.dir=$SDK_ROOT" > local.properties

          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name "sdkmanager" 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          fi

          if ! command -v gradle >/dev/null 2>&1; then
            curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /opt/gradle
            export PATH="/opt/gradle/gradle-8.7/bin:$PATH"
            echo "/opt/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"
          fi

      - name: Create complete project files
        env:
          GH_SECRET_TOKEN: ${{ secrets.MY_GH_TOKEN }}
        run: |
          set -e
          mkdir -p app/src/main/assets app/src/main/java/uz/qoriqlash/app app/src/main/res/values
          mkdir -p admin/src/main/java/uz/qoriqlash/admin admin/src/main/res/values

          cat <<'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Qoriqlash"
          include(":app", ":admin")
          EOF

          cat <<'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat <<'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat <<'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "uz.qoriqlash.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "uz.qoriqlash.app"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 16
                  versionName = "4.0-cyber-pro"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-ktx:1.9.2")
              implementation("androidx.fragment:fragment-ktx:1.8.2")
              implementation("androidx.lifecycle:lifecycle-service:2.8.4")
              implementation("androidx.camera:camera-core:1.3.4")
              implementation("androidx.camera:camera-camera2:1.3.4")
              implementation("androidx.camera:camera-lifecycle:1.3.4")
              implementation("androidx.camera:camera-view:1.3.4")
              implementation("androidx.security:security-crypto:1.1.0-alpha06")
              implementation("androidx.biometric:biometric:1.1.0")
              implementation("com.google.mlkit:face-detection:16.1.7")
              implementation("com.google.mlkit:object-detection:17.0.2")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
          }
          EOF

          cat <<'EOF' > app/proguard-rules.pro
          -keep class uz.qoriqlash.app.MainActivity$CameraBridge {
              @android.webkit.JavascriptInterface <methods>;
          }
          -keep class uz.qoriqlash.app.MonitorForegroundService { *; }
          EOF

          cat <<'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Qo‘riqlash</string>
          </resources>
          EOF

          cat <<'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CAMERA" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-permission android:name="android.permission.USE_BIOMETRIC" />

              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.microphone" android:required="false" />

              <application
                  android:allowBackup="false"
                  android:fullBackupContent="false"
                  android:hardwareAccelerated="true"
                  android:label="Qo‘riqlash"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <service
                      android:name=".MonitorForegroundService"
                      android:enabled="true"
                      android:exported="false"
                      android:stopWithTask="false"
                      android:foregroundServiceType="dataSync|camera|microphone" />

                  <receiver
                      android:name=".BootReceiver"
                      android:enabled="true"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                      </intent-filter>
                  </receiver>

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat <<'EOF' > app/src/main/java/uz/qoriqlash/app/SecureStore.kt
          package uz.qoriqlash.app

          import android.annotation.SuppressLint
          import android.content.Context
          import android.content.SharedPreferences
          import android.os.Build
          import android.provider.Settings
          import androidx.security.crypto.EncryptedSharedPreferences
          import androidx.security.crypto.MasterKey
          import org.json.JSONArray
          import org.json.JSONObject
          import java.security.MessageDigest
          import java.util.UUID

          object SecureStore {
              private const val PREF_NAME = "qoriqlash_vault_v4"
              private const val CREATOR_CODE_HASH = "e69b7525e846a20b5663e0d3f7510f72b3e302212650d1c0c563a3560d481b39"

              private fun prefs(ctx: Context): SharedPreferences {
                  return try {
                      val masterKey = MasterKey.Builder(ctx.applicationContext)
                          .setKeyScheme(MasterKey.KeyScheme.AES256_GCM)
                          .build()
                      EncryptedSharedPreferences.create(
                          ctx.applicationContext,
                          PREF_NAME,
                          masterKey,
                          EncryptedSharedPreferences.PrefKeyEncryptionScheme.AES256_SIV,
                          EncryptedSharedPreferences.PrefValueEncryptionScheme.AES256_GCM
                      )
                  } catch (_: Exception) {
                      ctx.applicationContext.getSharedPreferences(PREF_NAME + "_fb", Context.MODE_PRIVATE)
                  }
              }

              private fun sha256(text: String): String {
                  val digest = MessageDigest.getInstance("SHA-256").digest(text.toByteArray(Charsets.UTF_8))
                  return digest.joinToString("") { "%02x".format(it) }
              }

              @SuppressLint("HardwareIds")
              fun getDeviceId(ctx: Context): String {
                  val p = prefs(ctx)
                  var id = p.getString("unique_dev_id", "") ?: ""
                  if (id.isEmpty()) {
                      val androidId = try {
                          Settings.Secure.getString(ctx.contentResolver, Settings.Secure.ANDROID_ID) ?: ""
                      } catch (_: Exception) { "" }
                      id = if (androidId.length >= 8) {
                          "QR-${androidId.take(10).uppercase()}"
                      } else {
                          "QR-${UUID.randomUUID().toString().take(10).uppercase()}"
                      }
                      p.edit().putString("unique_dev_id", id).apply()
                  }
                  return id
              }

              fun getDeviceModel(): String {
                  val manu = Build.MANUFACTURER.replaceFirstChar { it.uppercase() }
                  val model = Build.MODEL
                  return if (model.startsWith(manu, ignoreCase = true)) model else "$manu $model"
              }

              fun setClientProfile(ctx: Context, name: String, phone: String) {
                  prefs(ctx).edit()
                      .putString("client_name", name.trim())
                      .putString("client_phone", phone.trim())
                      .apply()
              }

              fun getClientName(ctx: Context): String = prefs(ctx).getString("client_name", "") ?: ""
              fun getClientPhone(ctx: Context): String = prefs(ctx).getString("client_phone", "") ?: ""

              // Token faqat bir marta yoziladi va AES-256 bilan shifrlanadi
              fun setCustomToken(ctx: Context, token: String) {
                  val clean = token.trim()
                  if (clean.isNotEmpty()) {
                      prefs(ctx).edit().putString("custom_gh_token_enc", clean).apply()
                  }
              }

              fun getCustomToken(ctx: Context): String = prefs(ctx).getString("custom_gh_token_enc", "") ?: ""
              fun hasCustomToken(ctx: Context): Boolean = getCustomToken(ctx).isNotEmpty()

              fun setRemoteControlState(
                  ctx: Context,
                  active: Boolean,
                  remoteCode: String,
                  message: String,
                  expiresAt: String
              ) {
                  prefs(ctx).edit()
                      .putBoolean("remote_active", active)
                      .putString("remote_code", remoteCode.trim())
                      .putString("remote_msg", message.trim())
                      .putString("remote_expires", expiresAt.trim())
                      .apply()
              }

              fun isRemoteActive(ctx: Context): Boolean = prefs(ctx).getBoolean("remote_active", true)
              fun getRemoteMessage(ctx: Context): String = prefs(ctx).getString("remote_msg", "") ?: ""
              fun getRemoteCode(ctx: Context): String = prefs(ctx).getString("remote_code", "") ?: ""
              fun getRemoteExpires(ctx: Context): String = prefs(ctx).getString("remote_expires", "") ?: ""

              fun isCreatorActivated(ctx: Context): Boolean {
                  return prefs(ctx).getBoolean("creator_activated_once", false)
              }

              fun verifyAndActivateCreatorCode(ctx: Context, rawInput: String): Boolean {
                  val normalized = rawInput.trim().lowercase()
                  if (normalized.isEmpty()) return false
                  val remoteCode = getRemoteCode(ctx).lowercase()
                  val ok = (remoteCode.isNotEmpty() && normalized == remoteCode) ||
                           normalized == "alisa" ||
                           sha256(normalized) == CREATOR_CODE_HASH
                  if (ok) {
                      prefs(ctx).edit().putBoolean("creator_activated_once", true).apply()
                      return true
                  }
                  return false
              }

              fun saveConfigJson(ctx: Context, json: String) {
                  prefs(ctx).edit().putString("cfg_json", json).apply()
              }

              fun loadConfigJson(ctx: Context): String {
                  return prefs(ctx).getString("cfg_json", "") ?: ""
              }

              fun loadConfig(ctx: Context): JSONObject {
                  val raw = loadConfigJson(ctx)
                  return try {
                      if (raw.isNotEmpty()) JSONObject(raw) else JSONObject()
                  } catch (_: Exception) {
                      JSONObject()
                  }
              }

              fun setWasRunning(ctx: Context, running: Boolean) {
                  prefs(ctx).edit().putBoolean("was_running", running).apply()
              }

              fun wasRunning(ctx: Context): Boolean {
                  return prefs(ctx).getBoolean("was_running", false)
              }

              fun setPin(ctx: Context, pin: String) {
                  prefs(ctx).edit().putString("app_pin", pin.trim()).apply()
              }

              fun getPin(ctx: Context): String {
                  return prefs(ctx).getString("app_pin", "") ?: ""
              }

              fun hasPin(ctx: Context): Boolean = getPin(ctx).length >= 4

              fun checkPin(ctx: Context, input: String): Boolean {
                  val saved = getPin(ctx)
                  if (saved.isEmpty()) return true
                  return saved == input.trim()
              }

              fun setLastUpdateId(ctx: Context, id: Long) {
                  prefs(ctx).edit().putLong("tg_offset", id).apply()
              }

              fun getLastUpdateId(ctx: Context): Long {
                  return prefs(ctx).getLong("tg_offset", 0L)
              }

              fun saveKnownFacesJson(ctx: Context, json: String) {
                  prefs(ctx).edit().putString("known_faces", json).apply()
              }

              fun getKnownFacesArray(ctx: Context): JSONArray {
                  return try {
                      val raw = prefs(ctx).getString("known_faces", "[]") ?: "[]"
                      JSONArray(raw)
                  } catch (_: Exception) {
                      JSONArray()
                  }
              }

              fun saveCounts(ctx: Context, dayKey: String, enter: Int, exit: Int) {
                  prefs(ctx).edit()
                      .putString("cnt_day", dayKey)
                      .putInt("cnt_in", enter)
                      .putInt("cnt_out", exit)
                      .apply()
              }

              fun loadCounts(ctx: Context, dayKey: String): Pair<Int, Int> {
                  val p = prefs(ctx)
                  val savedDay = p.getString("cnt_day", "") ?: ""
                  if (savedDay != dayKey) return 0 to 0
                  return p.getInt("cnt_in", 0) to p.getInt("cnt_out", 0)
              }
          }
          EOF

          cat <<'EOF' > app/src/main/java/uz/qoriqlash/app/RemoteControlClient.kt
          package uz.qoriqlash.app

          import android.content.Context
          import android.util.Base64
          import okhttp3.MediaType.Companion.toMediaType
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import okhttp3.RequestBody.Companion.toRequestBody
          import org.json.JSONArray
          import org.json.JSONObject
          import java.text.SimpleDateFormat
          import java.util.Calendar
          import java.util.Date
          import java.util.Locale
          import java.util.concurrent.TimeUnit

          object RemoteControlClient {
              private const val CONFIG_RAW_URL = "https://raw.githubusercontent.com/aaaa1111bbbbv-dot/mukamal/main/config.json"
              private const val USERS_API_URL = "https://api.github.com/repos/aaaa1111bbbbv-dot/mukamal/contents/users.json"
              private const val EMBEDDED_TOKEN = "__GH_SECRET_PLACEHOLDER__"

              private val client = OkHttpClient.Builder()
                  .connectTimeout(6, TimeUnit.SECONDS)
                  .readTimeout(8, TimeUnit.SECONDS)
                  .build()

              data class RemoteState(
                  val active: Boolean,
                  val code: String,
                  val message: String,
                  val expiresAt: String,
                  val syncStatus: String,
                  val tokenConfigured: Boolean
              )

              fun getActiveToken(ctx: Context): String {
                  val manual = SecureStore.getCustomToken(ctx).trim()
                  if (manual.startsWith("ghp_") || manual.startsWith("github_pat_")) return manual
                  if (EMBEDDED_TOKEN.startsWith("ghp_") || EMBEDDED_TOKEN.startsWith("github_pat_")) {
                      SecureStore.setCustomToken(ctx, EMBEDDED_TOKEN)
                      return EMBEDDED_TOKEN
                  }
                  return ""
              }

              private fun isDateExpired(yyyyMmDd: String): Boolean {
                  if (yyyyMmDd.isBlank()) return false
                  return try {
                      val sdf = SimpleDateFormat("yyyy-MM-dd", Locale.US).apply { isLenient = false }
                      val expDate = sdf.parse(yyyyMmDd.trim()) ?: return false
                      val cal = Calendar.getInstance().apply {
                          time = expDate
                          set(Calendar.HOUR_OF_DAY, 23)
                          set(Calendar.MINUTE, 59)
                          set(Calendar.SECOND, 59)
                      }
                      System.currentTimeMillis() > cal.timeInMillis
                  } catch (_: Exception) {
                      false
                  }
              }

              private fun addDaysFormatted(days: Int): String {
                  val cal = Calendar.getInstance().apply { add(Calendar.DAY_OF_YEAR, days) }
                  return SimpleDateFormat("yyyy-MM-dd", Locale.US).format(cal.time)
              }

              private fun nowFormatted(): String {
                  return SimpleDateFormat("yyyy-MM-dd HH:mm", Locale.getDefault()).format(Date())
              }

              fun syncNow(ctx: Context, isMonitoringRunning: Boolean = false): RemoteState {
                  var globalActive = true
                  var globalCode = "Alisa"
                  var globalMsg = ""

                  try {
                      val req = Request.Builder()
                          .url("$CONFIG_RAW_URL?t=${System.currentTimeMillis()}")
                          .header("Cache-Control", "no-cache")
                          .build()
                      client.newCall(req).execute().use { resp ->
                          if (resp.isSuccessful) {
                              val body = resp.body?.string() ?: ""
                              if (body.isNotEmpty()) {
                                  val j = JSONObject(body)
                                  globalActive = j.optBoolean("active", true)
                                  globalCode = j.optString("code", "Alisa")
                                  globalMsg = j.optString("message", "")
                              }
                          }
                      }
                  } catch (_: Exception) {
                  }

                  val tok = getActiveToken(ctx)
                  val hasTok = tok.isNotEmpty()
                  if (hasTok) {
                      val userSync = syncUserRecordWithGitHub(ctx, tok, isMonitoringRunning, globalMsg)
                      if (userSync != null) {
                          val finalActive = globalActive && userSync.first
                          val finalMsg = if (!finalActive && userSync.second.isNotEmpty()) {
                              userSync.second
                          } else if (userSync.second.isNotEmpty()) {
                              userSync.second
                          } else {
                              globalMsg
                          }
                          SecureStore.setRemoteControlState(ctx, finalActive, globalCode, finalMsg, userSync.third)
                          return RemoteState(finalActive, globalCode, finalMsg, userSync.third, "🔒 Server ulangan (Shifrlangan)", true)
                      }
                  }

                  val cachedExp = SecureStore.getRemoteExpires(ctx)
                  val expBlocked = isDateExpired(cachedExp)
                  val finalAct = globalActive && !expBlocked && SecureStore.isRemoteActive(ctx)
                  val finalMsg = if (expBlocked) {
                      "Obuna muddatingiz ($cachedExp) tugadi. Davom ettirish uchun to‘lov qiling."
                  } else {
                      globalMsg.ifEmpty { SecureStore.getRemoteMessage(ctx) }
                  }
                  SecureStore.setRemoteControlState(ctx, finalAct, globalCode, finalMsg, cachedExp)
                  val stLabel = if (!hasTok) "⚠️ Server tokeni kiritilmagan" else "🔒 Token saqlangan · Oflayn rejim"
                  return RemoteState(finalAct, globalCode, finalMsg, cachedExp, stLabel, hasTok)
              }

              private fun syncUserRecordWithGitHub(
                  ctx: Context,
                  tok: String,
                  isMonitoringRunning: Boolean,
                  defaultMsg: String
              ): Triple<Boolean, String, String>? {
                  val devId = SecureStore.getDeviceId(ctx)
                  val clientName = SecureStore.getClientName(ctx)
                  if (clientName.isEmpty()) return null

                  val clientPhone = SecureStore.getClientPhone(ctx)
                  val model = SecureStore.getDeviceModel()
                  val nowStr = nowFormatted()

                  for (attempt in 0..1) {
                      try {
                          val getReq = Request.Builder()
                              .url("$USERS_API_URL?t=${System.currentTimeMillis()}")
                              .header("Authorization", "token $tok")
                              .header("Accept", "application/vnd.github.v3+json")
                              .build()

                          var sha = ""
                          var rootObj = JSONObject().apply { put("users", JSONArray()) }

                          client.newCall(getReq).execute().use { resp ->
                              if (resp.isSuccessful) {
                                  val resJson = JSONObject(resp.body?.string() ?: "{}")
                                  sha = resJson.optString("sha", "")
                                  val b64 = resJson.optString("content", "").replace("\n", "")
                                  if (b64.isNotEmpty()) {
                                      val decoded = String(Base64.decode(b64, Base64.DEFAULT), Charsets.UTF_8)
                                      rootObj = JSONObject(decoded)
                                  }
                              } else if (resp.code != 404) {
                                  return null
                              }
                          }

                          val usersArr = rootObj.optJSONArray("users") ?: JSONArray()
                          var foundObj: JSONObject? = null
                          for (i in 0 until usersArr.length()) {
                              val u = usersArr.optJSONObject(i) ?: continue
                              if (u.optString("id") == devId) {
                                  foundObj = u
                                  break
                              }
                          }

                          if (foundObj == null) {
                              foundObj = JSONObject().apply {
                                  put("id", devId)
                                  put("name", clientName)
                                  put("phone", clientPhone)
                                  put("model", model)
                                  put("registeredAt", nowStr)
                                  put("lastSeen", nowStr)
                                  put("monitoring", isMonitoringRunning)
                                  put("active", true)
                                  put("expiresAt", addDaysFormatted(30))
                                  put("note", "")
                              }
                              usersArr.put(foundObj)
                          } else {
                              foundObj.put("name", clientName)
                              if (clientPhone.isNotEmpty()) foundObj.put("phone", clientPhone)
                              foundObj.put("model", model)
                              foundObj.put("lastSeen", nowStr)
                              foundObj.put("monitoring", isMonitoringRunning)
                          }

                          val userActiveFlag = foundObj.optBoolean("active", true)
                          val expiresAt = foundObj.optString("expiresAt", "")
                          val customNote = foundObj.optString("note", "")
                          val expired = isDateExpired(expiresAt)
                          if (expired && userActiveFlag) {
                              foundObj.put("active", false)
                          }

                          rootObj.put("users", usersArr)
                          val encoded = Base64.encodeToString(rootObj.toString(2).toByteArray(Charsets.UTF_8), Base64.NO_WRAP)
                          val putBody = JSONObject().apply {
                              put("message", "User sync: $devId")
                              put("content", encoded)
                              if (sha.isNotEmpty()) put("sha", sha)
                          }

                          val putReq = Request.Builder()
                              .url(USERS_API_URL)
                              .header("Authorization", "token $tok")
                              .header("Accept", "application/vnd.github.v3+json")
                              .put(putBody.toString().toRequestBody("application/json; charset=utf-8".toMediaType()))
                              .build()

                          client.newCall(putReq).execute().use { putResp ->
                              if (putResp.isSuccessful) {
                                  val allowed = userActiveFlag && !expired
                                  val msgOut = when {
                                      expired -> "Obuna muddatingiz ($expiresAt) tugadi. Davom ettirish uchun to‘lov qiling."
                                      !userActiveFlag -> customNote.ifEmpty { "Sizning obunangiz vaqtincha to‘xtatilgan." }
                                      else -> customNote.ifEmpty { defaultMsg }
                                  }
                                  return Triple(allowed, msgOut, expiresAt)
                              }
                          }
                      } catch (_: Exception) {
                      }
                  }
                  return null
              }
          }
          EOF

          if [ -n "$GH_SECRET_TOKEN" ]; then
            sed -i "s|__GH_SECRET_PLACEHOLDER__|$GH_SECRET_TOKEN|g" app/src/main/java/uz/qoriqlash/app/RemoteControlClient.kt
          fi

          cat <<'EOF' > app/src/main/java/uz/qoriqlash/app/BootReceiver.kt
          package uz.qoriqlash.app

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.os.Build

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent?) {
                  val action = intent?.action ?: return
                  if (action == Intent.ACTION_BOOT_COMPLETED ||
                      action == "android.intent.action.QUICKBOOT_POWERON" ||
                      action == Intent.ACTION_MY_PACKAGE_REPLACED
                  ) {
                      if (SecureStore.wasRunning(context) && SecureStore.isRemoteActive(context)) {
                          val startIntent = Intent(context, MonitorForegroundService::class.java).apply {
                              this.action = MonitorForegroundService.ACTION_START
                          }
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              context.startForegroundService(startIntent)
                          } else {
                              context.startService(startIntent)
                          }
                      }
                  }
              }
          }
          EOF

          cat <<'EOF' > app/src/main/java/uz/qoriqlash/app/CameraAuthClient.kt
          package uz.qoriqlash.app

          import android.util.Base64
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import java.security.MessageDigest
          import java.security.SecureRandom
          import java.security.cert.X509Certificate
          import java.util.Locale
          import java.util.concurrent.TimeUnit
          import java.util.concurrent.atomic.AtomicInteger
          import javax.net.ssl.SSLContext
          import javax.net.ssl.TrustManager
          import javax.net.ssl.X509TrustManager

          object CameraAuthClient {
              private val nonceCounter = AtomicInteger(1)

              private val client: OkHttpClient by lazy {
                  val trustAll = arrayOf<TrustManager>(object : X509TrustManager {
                      override fun checkClientTrusted(chain: Array<out X509Certificate>?, authType: String?) {}
                      override fun checkServerTrusted(chain: Array<out X509Certificate>?, authType: String?) {}
                      override fun getAcceptedIssuers(): Array<X509Certificate> = emptyArray()
                  })
                  val sslContext = SSLContext.getInstance("TLS")
                  sslContext.init(null, trustAll, SecureRandom())
                  OkHttpClient.Builder()
                      .sslSocketFactory(sslContext.socketFactory, trustAll[0] as X509TrustManager)
                      .hostnameVerifier { _, _ -> true }
                      .connectTimeout(5, TimeUnit.SECONDS)
                      .readTimeout(8, TimeUnit.SECONDS)
                      .build()
              }

              fun fetchSnapshotBytes(url: String, user: String, pass: String): ByteArray? {
                  if (url.isBlank()) return null
                  val baseReq = Request.Builder()
                      .url(url.trim())
                      .header("User-Agent", "QoriqlashGuard/4.0")
                      .header("Accept", "image/jpeg,image/*,*/*")
                      .build()

                  client.newCall(baseReq).execute().use { firstResp ->
                      if (firstResp.isSuccessful) {
                          val bytes = firstResp.body?.bytes()
                          if (bytes != null && bytes.isNotEmpty()) return bytes
                      }
                      if (firstResp.code == 401 && user.isNotEmpty()) {
                          val challenges = firstResp.headers("WWW-Authenticate")
                          val digestHeader = challenges.firstOrNull { it.startsWith("Digest", ignoreCase = true) }
                          if (digestHeader != null) {
                              val auth = buildDigestHeader(digestHeader, "GET", baseReq.url.encodedPath, user, pass)
                              if (auth != null) {
                                  val retryReq = baseReq.newBuilder().header("Authorization", auth).build()
                                  client.newCall(retryReq).execute().use { secondResp ->
                                      if (secondResp.isSuccessful) {
                                          return secondResp.body?.bytes()
                                      }
                                  }
                              }
                          }
                          val basicToken = Base64.encodeToString("$user:$pass".toByteArray(Charsets.UTF_8), Base64.NO_WRAP)
                          val basicReq = baseReq.newBuilder().header("Authorization", "Basic $basicToken").build()
                          client.newCall(basicReq).execute().use { thirdResp ->
                              if (thirdResp.isSuccessful) {
                                  return thirdResp.body?.bytes()
                              }
                          }
                      }
                  }
                  return null
              }

              private fun buildDigestHeader(
                  header: String,
                  method: String,
                  uri: String,
                  user: String,
                  pass: String
              ): String? {
                  val params = parseAuthParams(header.removePrefix("Digest").removePrefix("digest").trim())
                  val realm = params["realm"] ?: return null
                  val nonce = params["nonce"] ?: return null
                  val qop = params["qop"]
                  val opaque = params["opaque"]
                  val algorithm = params["algorithm"] ?: "MD5"

                  var ha1 = md5Hex("$user:$realm:$pass")
                  val cnonce = String.format(Locale.US, "%08x", SecureRandom().nextInt())
                  if (algorithm.equals("MD5-sess", ignoreCase = true)) {
                      ha1 = md5Hex("$ha1:$nonce:$cnonce")
                  }
                  val ha2 = md5Hex("$method:$uri")

                  val nc = String.format(Locale.US, "%08x", nonceCounter.getAndIncrement())
                  val chosenQop = qop?.split(",")?.map { it.trim() }?.firstOrNull { it == "auth" }
                  val responseHash = if (chosenQop != null) {
                      md5Hex("$ha1:$nonce:$nc:$cnonce:$chosenQop:$ha2")
                  } else {
                      md5Hex("$ha1:$nonce:$ha2")
                  }

                  val sb = StringBuilder()
                  sb.append("Digest username=\"").append(user).append("\", ")
                  sb.append("realm=\"").append(realm).append("\", ")
                  sb.append("nonce=\"").append(nonce).append("\", ")
                  sb.append("uri=\"").append(uri).append("\", ")
                  sb.append("response=\"").append(responseHash).append("\"")
                  if (chosenQop != null) {
                      sb.append(", qop=").append(chosenQop)
                      sb.append(", nc=").append(nc)
                      sb.append(", cnonce=\"").append(cnonce).append("\"")
                  }
                  if (opaque != null) {
                      sb.append(", opaque=\"").append(opaque).append("\"")
                  }
                  return sb.toString()
              }

              private fun parseAuthParams(raw: String): Map<String, String> {
                  val map = mutableMapOf<String, String>()
                  val regex = Regex("""(\w+)=("([^"]*)"|([^,\s]+))""")
                  for (m in regex.findAll(raw)) {
                      val key = m.groupValues[1]
                      val value = if (m.groupValues[3].isNotEmpty()) m.groupValues[3] else m.groupValues[4]
                      map[key] = value
                  }
                  return map
              }

              private fun md5Hex(input: String): String {
                  val digest = MessageDigest.getInstance("MD5").digest(input.toByteArray(Charsets.UTF_8))
                  return digest.joinToString("") { "%02x".format(it) }
              }
          }
